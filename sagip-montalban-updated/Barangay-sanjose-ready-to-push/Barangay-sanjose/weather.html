<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panahon Live Weather Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* Layout: full-bleed colour map, glass layer switcher on top, legend + rain timeline at the bottom */
  :root {
    --bg: #dfe7ee;
    --panel: rgba(255,255,255,.88);
    --fg: #14202b;
    --muted: #51616e;
    --line: rgba(20,32,43,.14);
    --accent: #1769e0;
    --accent-fg: #ffffff;
    --halo: rgba(255,255,255,.95);
    --shadow: 0 4px 18px rgba(15,30,45,.22);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161c; --panel: rgba(20,28,36,.86); --fg: #eef3f7; --muted: #a2b0bb; --line: rgba(255,255,255,.14);
      --accent: #4c92ff; --accent-fg: #06101c; --halo: rgba(8,14,20,.95); --shadow: 0 4px 18px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161c; --panel: rgba(20,28,36,.86); --fg: #eef3f7; --muted: #a2b0bb; --line: rgba(255,255,255,.14);
    --accent: #4c92ff; --accent-fg: #06101c; --halo: rgba(8,14,20,.95); --shadow: 0 4px 18px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .leaflet-container { font-family: var(--font); background: var(--bg); }

  .bar { position: absolute; z-index: 1000; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .glass { background: var(--panel); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: var(--shadow); border: 1px solid var(--line); }
  .brand { border-radius: 12px; padding: 8px 14px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #e11d48; margin-right: 6px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #e11d48; box-shadow: 0 0 0 0 rgba(225,29,72,.6); animation: livepulse 1.6s infinite; }
  @keyframes livepulse { 0% { box-shadow: 0 0 0 0 rgba(225,29,72,.6); } 70% { box-shadow: 0 0 0 7px rgba(225,29,72,0); } 100% { box-shadow: 0 0 0 0 rgba(225,29,72,0); } }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 2px; border-radius: 12px; padding: 4px; }
  .tabs button { font: inherit; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-radius: 9px; padding: 8px 16px; cursor: pointer; min-height: 36px; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spacer { width: 120px; }

  .dock { position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; pointer-events: none; flex-wrap: wrap; }
  .dock > * { pointer-events: auto; }
  .card { border-radius: 12px; padding: 10px 14px; }
  .legend { min-width: 240px; max-width: 300px; }
  .legend h2 { margin: 0 0 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .ramp { height: 12px; border-radius: 6px; border: 1px solid var(--line); }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .note { margin: 6px 0 0; font-size: 11px; color: var(--muted); }
  .timeline { display: flex; align-items: center; gap: 10px; flex: 1 1 280px; max-width: 460px; margin-left: auto; margin-right: 56px; }
  .timeline button { font: inherit; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; flex: none; }
  .timeline input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .timeline time { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 92px; text-align: right; color: var(--muted); }
  .status { position: absolute; z-index: 1000; top: 62px; left: 50%; transform: translateX(-50%); color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; }

  /* Map pins: no boxes, just icon + text with a halo, like a printed weather map */
  .pin { display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); white-space: nowrap; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--fg); text-shadow: 0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 4px var(--halo), 0 0 6px var(--halo); pointer-events: none; }
  .pin svg { width: 34px; height: 34px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .pin .t { font-size: 16px; font-weight: 800; }
  .pin .nm { font-size: 11px; font-weight: 600; }
  .pin .dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); margin-bottom: 2px; }
  .arrow { width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: .9; }
  .arrow svg { width: 22px; height: 22px; display: block; }
  .leaflet-div-icon { background: none; border: 0; }
  .pop b { font-size: 16px; }
  .pop div { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); }
  .leaflet-control-zoom a { background: var(--panel); color: var(--fg); border-color: var(--line); }
  .leaflet-control-attribution { font-size: 10px; background: var(--panel) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }

  /* PAR boundary: white broken line, always visible */
  .par-boundary { stroke: #ffffff !important; stroke-opacity: 1 !important; stroke-dasharray: 10 7 !important; fill: none !important; }

  @media (max-width: 640px) {
    .bar { flex-wrap: wrap; }
    .spacer { display: none; }
    .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 8px 4px; }
    .status { top: 108px; }
    .timeline { margin-right: 0; max-width: none; flex-basis: 100%; }
    .legend { max-width: none; flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="bar">
  <div class="brand glass"><span class="live"><i></i>Live radar</span> Panahon<small id="updated">Loading…</small></div>
  <div class="tabs glass" role="group" aria-label="Map layer">
    <button type="button" data-layer="weather" aria-pressed="false">Weather</button>
    <button type="button" data-layer="temperature" aria-pressed="false">Temperature</button>
    <button type="button" data-layer="storm" aria-pressed="false">Storm</button>
    <button type="button" data-layer="rain" aria-pressed="false">Rain</button>
  </div>
  <div class="spacer" aria-hidden="true"></div>
</div>
<div class="status glass" id="status" hidden></div>

<div class="dock">
  <div class="card glass legend" id="legend" hidden></div>
  <div class="card glass timeline" id="timeline" hidden>

    <input type="range" id="frame" min="0" max="0" value="0" aria-label="Rain time">
    <time id="frameTime">--:--</time>
  </div>
</div>

  // One request per batch. Open-Meteo rate-limits bursts, so a 429 or 5xx is retried with a short backoff.

    return Promise.all(runners).then(function () {

      if (!got) throw new Error('no data');
      writeCache(all, t);

  /* ---------- Colour field: interpolated grid, stretched past the edges ---------- */
  function mercY(lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)); }

    var W = 600, yT = mercY(EXT.n), yB = mercY(EXT.s);

    applyData(cached.all, cached.t);
  } else {
    setStatus('Loading weather…');
  }
  loadWeather();
  setInterval(loadWeather, REFRESH_MS);
  loadRadar();
  setInterval(loadRadar, RADAR_MS);
})();
</script>
</body>

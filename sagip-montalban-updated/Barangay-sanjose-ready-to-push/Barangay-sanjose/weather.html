<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panahon Live Weather Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* Layout: full-bleed colour map, glass layer switcher on top, legend + rain timeline at the bottom */
  :root {
    --bg: #dfe7ee;
    --panel: rgba(255,255,255,.88);
    --fg: #14202b;
    --muted: #51616e;
    --line: rgba(20,32,43,.14);
    --accent: #1769e0;
    --accent-fg: #ffffff;
    --halo: rgba(255,255,255,.95);
    --shadow: 0 4px 18px rgba(15,30,45,.22);
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161c; --panel: rgba(20,28,36,.86); --fg: #eef3f7; --muted: #a2b0bb; --line: rgba(255,255,255,.14);
      --accent: #4c92ff; --accent-fg: #06101c; --halo: rgba(8,14,20,.95); --shadow: 0 4px 18px rgba(0,0,0,.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10161c; --panel: rgba(20,28,36,.86); --fg: #eef3f7; --muted: #a2b0bb; --line: rgba(255,255,255,.14);
    --accent: #4c92ff; --accent-fg: #06101c; --halo: rgba(8,14,20,.95); --shadow: 0 4px 18px rgba(0,0,0,.55);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--font); overflow: hidden; }
  #map { position: absolute; inset: 0; background: var(--bg); }
  .leaflet-container { font-family: var(--font); background: var(--bg); }

  .bar { position: absolute; z-index: 1000; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .glass { background: var(--panel); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: var(--shadow); border: 1px solid var(--line); }
  .brand { border-radius: 12px; padding: 8px 14px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 2px; border-radius: 12px; padding: 4px; }
  .tabs button { font: inherit; font-weight: 600; color: var(--muted); background: transparent; border: 0; border-radius: 9px; padding: 8px 16px; cursor: pointer; min-height: 36px; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .spacer { width: 120px; }

  .dock { position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; pointer-events: none; flex-wrap: wrap; }
  .dock > * { pointer-events: auto; }
  .card { border-radius: 12px; padding: 10px 14px; }
  .legend { min-width: 240px; max-width: 300px; }
  .legend h2 { margin: 0 0 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .ramp { height: 12px; border-radius: 6px; border: 1px solid var(--line); }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .note { margin: 6px 0 0; font-size: 11px; color: var(--muted); }
  .timeline { display: flex; align-items: center; gap: 10px; flex: 1 1 280px; max-width: 460px; margin-left: auto; margin-right: 56px; }
  .timeline button { font: inherit; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); cursor: pointer; flex: none; }
  .timeline input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .timeline time { font-variant-numeric: tabular-nums; font-size: 12px; min-width: 92px; text-align: right; color: var(--muted); }
  .status { position: absolute; z-index: 1000; top: 62px; left: 50%; transform: translateX(-50%); color: var(--muted); padding: 6px 12px; border-radius: 8px; font-size: 12px; }

  /* Map pins: no boxes, just icon + text with a halo, like a printed weather map */
  .pin { display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); white-space: nowrap; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--fg); text-shadow: 0 0 2px var(--halo), 0 0 2px var(--halo), 0 0 4px var(--halo), 0 0 6px var(--halo); pointer-events: none; }
  .pin svg { width: 34px; height: 34px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .pin .t { font-size: 16px; font-weight: 800; }
  .pin .nm { font-size: 11px; font-weight: 600; }
  .pin .dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4); margin-bottom: 2px; }
  .arrow { width: 22px; height: 22px; margin: -11px 0 0 -11px; opacity: .9; }
  .arrow svg { width: 22px; height: 22px; display: block; }
  .leaflet-div-icon { background: none; border: 0; }
  .pop b { font-size: 16px; }
  .pop div { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--fg); }
  .leaflet-control-zoom a { background: var(--panel); color: var(--fg); border-color: var(--line); }
  .leaflet-control-attribution { font-size: 10px; background: var(--panel) !important; color: var(--muted); }
  .leaflet-control-attribution a { color: var(--muted); }

  /* PAR boundary: white broken line, always visible */
  .par-boundary { stroke: #ffffff !important; stroke-opacity: 1 !important; stroke-dasharray: 10 7 !important; fill: none !important; }

  @media (max-width: 640px) {
    .bar { flex-wrap: wrap; }
    .spacer { display: none; }
    .tabs { width: 100%; }
    .tabs button { flex: 1; padding: 8px 4px; }
    .status { top: 108px; }
    .timeline { margin-right: 0; max-width: none; flex-basis: 100%; }
    .legend { max-width: none; flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Weather map"></div>

<div class="bar">
  <div class="brand glass">Panahon<small id="updated">Loading…</small></div>
  <div class="tabs glass" role="group" aria-label="Map layer">
    <button type="button" data-layer="weather" aria-pressed="false">Weather</button>
    <button type="button" data-layer="temperature" aria-pressed="false">Temperature</button>
    <button type="button" data-layer="storm" aria-pressed="false">Storm</button>
    <button type="button" data-layer="rain" aria-pressed="false">Rain</button>
  </div>
  <div class="spacer" aria-hidden="true"></div>
</div>
<div class="status glass" id="status" hidden></div>

<div class="dock">
  <div class="card glass legend" id="legend" hidden></div>
  <div class="card glass timeline" id="timeline" hidden>
    <button type="button" id="play" aria-label="Play rain loop">&#9654;</button>
    <input type="range" id="frame" min="0" max="0" value="0" aria-label="Rain time">
    <time id="frameTime">--:--</time>
  </div>
</div>

  }

  var GP = [];
  for (var gi = 0; gi < NLAT; gi++) for (var gj = 0; gj < NLON; gj++) GP.push([LAT0 + gi * STEP, LON0 + gj * STEP]);
  var CP = CITIES.map(function (c) { return [c[1], c[2]]; });

  function applyData(all, t) {
    gridData = all.slice(0, GP.length);
    cityData = all.slice(GP.length);
    setupRain();
    $('#updated').textContent = 'Updated ' + hhmm(new Date(t));
    setStatus('');
    render();
  }

  function loadWeather() {
    return fetchPoints(GP.concat(CP)).then(function (all) {
      var t = Date.now();
      writeCache(all, t);
      applyData(all, t);
    }).catch(function (e) {
      if (!gridData) setStatus('Could not load weather data. Check your connection and refresh.');
      console.error(e);
    });
  }

  /* ---------- Colour field: interpolated grid, stretched past the edges ---------- */
  function mercY(lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)); }
  function cr(t) { // Catmull-Rom weights: smooth curves through the grid points, no flat blocks
    var t2 = t * t, t3 = t2 * t;
    return [(-t3 + 2 * t2 - t) / 2, (3 * t3 - 5 * t2 + 2) / 2, (-3 * t3 + 4 * t2 + t) / 2, (t3 - t2) / 2];
  }
  function field(get, stops) {
    var W = 600, yT = mercY(EXT.n), yB = mercY(EXT.s);
    var H = Math.round(W * (yT - yB) / ((EXT.e - EXT.w) * Math.PI / 180));
    var cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    var ctx = cv.getContext('2d'), img = ctx.createImageData(W, H);
    var vals = new Float32Array(NLAT * NLON);
    for (var k = 0; k < vals.length; k++) { var d = gridData[k], x0 = d ? get(d) : 0; vals[k] = x0 == null ? 0 : x0; }
    function at(i, j) { return vals[Math.min(NLAT - 1, Math.max(0, i)) * NLON + Math.min(NLON - 1, Math.max(0, j))]; }
    var wxs = new Array(W), jx = new Int16Array(W);
    for (var x = 0; x < W; x++) {
      var lon = EXT.w + x / (W - 1) * (EXT.e - EXT.w), fj = Math.min(NLON - 1, Math.max(0, (lon - LON0) / STEP));
      var j0 = Math.min(NLON - 2, Math.floor(fj)); jx[x] = j0; wxs[x] = cr(fj - j0);
    }
    for (var r = 0; r < H; r++) {
      var y = yT - r / (H - 1) * (yT - yB), lat = (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI;
      var fi = Math.min(NLAT - 1, Math.max(0, (lat - LAT0) / STEP)), i0 = Math.min(NLAT - 2, Math.floor(fi)), wy = cr(fi - i0);
      for (var xx = 0; xx < W; xx++) {
        var j = jx[xx], wv = wxs[xx], val = 0;
        for (var m = 0; m < 4; m++) {
          val += (at(i0 - 1 + m, j - 1) * wv[0] + at(i0 - 1 + m, j) * wv[1] + at(i0 - 1 + m, j + 1) * wv[2] + at(i0 - 1 + m, j + 2) * wv[3]) * wy[m];
        }
        var col = colorAt(stops, val), p = (r * W + xx) * 4;
        img.data[p] = col[0]; img.data[p + 1] = col[1]; img.data[p + 2] = col[2]; img.data[p + 3] = col[3];
      }
    }
    ctx.putImageData(img, 0, 0);
    return L.imageOverlay(cv.toDataURL(), [[EXT.s, EXT.w], [EXT.n, EXT.e]], { pane: 'field', opacity: 0.92, interactive: false });
  }

  /* ---------- Rain frames (Open-Meteo hourly: past 3 h, now, next 6 h) ---------- */
  var rain = { times: [], idx: 0, timer: null, overlay: null, nowIdx: 0 };
  function setupRain() {
    var h = gridData && gridData[0] && gridData[0].hourly;
    if (!h) return;
    rain.times = h.time;
    var now = Math.floor(Date.now() / 3600000) * 3600, k = rain.times.indexOf(now);
    rain.nowIdx = k >= 0 ? k : Math.min(3, rain.times.length - 1);
    $('#frame').max = rain.times.length - 1;
  }
  function showFrame(i) {
    if (!rain.times.length) return;
    rain.idx = i; $('#frame').value = i;
    if (rain.overlay) map.removeLayer(rain.overlay);
    rain.overlay = field(function (d) { return d.hourly && d.hourly.precipitation[i]; }, RAIN_STOPS).addTo(map);
    var t = new Date(rain.times[i] * 1000), rel = i === rain.nowIdx ? 'now' : (i < rain.nowIdx ? 'past' : 'forecast');
    $('#frameTime').textContent = hhmm(t) + ' ' + rel;
    renderPins();
  }
  function clearRain() {
    stopPlay();
    if (rain.overlay) { map.removeLayer(rain.overlay); rain.overlay = null; }
  }
  function stopPlay() { clearInterval(rain.timer); rain.timer = null; $('#play').innerHTML = '&#9654;'; $('#play').setAttribute('aria-label', 'Play rain loop'); }
  function togglePlay() {
    if (rain.timer) return stopPlay();
    $('#play').innerHTML = '&#10074;&#10074;'; $('#play').setAttribute('aria-label', 'Pause rain loop');
    rain.timer = setInterval(function () { showFrame((rain.idx + 1) % rain.times.length); }, 800);
  }
  $('#play').addEventListener('click', togglePlay);
  $('#frame').addEventListener('input', function (e) { stopPlay(); showFrame(+e.target.value); });

  /* ---------- Rendering by layer ---------- */
  var current = 'weather', fieldObjs = [], pinObjs = [];

  var LEGENDS = {
    weather: { title: 'Cloud cover', ramp: css(CLOUD_STOPS), ticks: ['0%', '40%', '70%', '100%'], note: 'Warm = sunny, deep blue = overcast. Icons show current weather.' },
    temperature: { title: 'Temperature (°C)', ramp: css(TEMP_STOPS), ticks: ['16', '22', '26', '29', '32', '35', '39+'], note: 'Air temperature at 2 m.' },
    storm: { title: 'Wind gusts (km/h)', ramp: css(GUST_STOPS), ticks: ['0', '20', '40', '60', '80', '100', '130+'], note: 'Arrows show wind direction. Storm icon marks thunderstorms.' },
    rain: { title: 'Rain (mm per hour)', ramp: css(RAIN_STOPS), ticks: ['0', '0.2', '1', '3', '7', '15', '30', '50+'], note: 'Model data: 3 hours back, now, and 6 hours ahead.' }
  };

  function pinAt(latlng, html) {
    return L.marker(latlng, { icon: L.divIcon({ className: '', html: html, iconSize: [0, 0] }), keyboard: false, interactive: false });
  }
  function pinHtml(i) {
    var d = cityData && cityData[i]; if (!d) return null;
    var name = CITIES[i][0], w = wx(d.weather_code), t = Math.round(d.temperature_2m) + '°';
    if (current === 'weather') return '<div class="pin">' + SVG[w[1]] + '<span class="t">' + t + '</span><span class="nm">' + name + '</span></div>';
    if (current === 'temperature') return '<div class="pin"><span class="dot" style="background:' + rgb(colorAt(TEMP_STOPS, d.temperature_2m)) + '"></span><span class="t">' + t + '</span><span class="nm">' + name + '</span></div>';
    if (current === 'storm') return '<div class="pin">' + (w[1] === 'bolt' ? SVG.bolt : '') + '<span class="t">' + Math.round(d.wind_gusts_10m) + ' km/h</span><span class="nm">' + name + '</span></div>';
    var mm = d.hourly && d.hourly.precipitation[rain.idx] || 0;
    return '<div class="pin">' + (mm >= 0.1 ? SVG.rain : '') + '<span class="t">' + (mm >= 0.1 ? mm.toFixed(1) + ' mm' : '0') + '</span><span class="nm">' + name + '</span></div>';
  }
  function gridPinHtml(d) {
    var w = wx(d.weather_code);
    return '<div class="pin">' + SVG[w[1]] + '<span class="t">' + Math.round(d.temperature_2m) + '°</span></div>';
  }
  function renderPins() {
    pinObjs.forEach(function (o) { map.removeLayer(o); }); pinObjs = [];
    if (!cityData || !current) return;
    var z = map.getZoom(), maxRank = z <= 5 ? 1 : (z === 6 ? 2 : 3);
    CITIES.forEach(function (c, i) {
      if (c[3] > maxRank) return;
      var h = pinHtml(i); if (!h) return;
      var m = pinAt([c[1], c[2]], h); m.addTo(map); pinObjs.push(m);
    });
    if (current === 'storm' && gridData) {
      for (var a = 0; a < NLAT; a += 2) for (var b = 0; b < NLON; b += 2) {
        var d = gridData[a * NLON + b]; if (!d) continue;
        var m2 = pinAt([LAT0 + a * STEP, LON0 + b * STEP], '<div class="arrow">' + arrow(d.wind_direction_10m, d.wind_gusts_10m) + '</div>');
        m2.addTo(map); pinObjs.push(m2);
      }
    }
  }
  map.on('zoomend', renderPins);

  function render() {
    fieldObjs.forEach(function (o) { map.removeLayer(o); }); fieldObjs = [];
    if (current !== 'rain') clearRain();
    map.getPane('lines').style.display = current ? '' : 'none';
    $('#legend').hidden = !current || current === 'weather';
    $('#timeline').hidden = current !== 'rain';
    if (!current) { renderPins(); return; }
    var L_ = LEGENDS[current];
    $('#legend').innerHTML = '<h2>' + L_.title + '</h2><div class="ramp" style="background:' + L_.ramp + '"></div><div class="ticks">' +
      L_.ticks.map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div><p class="note">' + L_.note + '</p>';
    if (!gridData) return;

    if (current === 'temperature') fieldObjs.push(field(function (d) { return d.temperature_2m; }, TEMP_STOPS).addTo(map));
    if (current === 'storm') fieldObjs.push(field(function (d) { return d.wind_gusts_10m; }, GUST_STOPS).addTo(map));
    if (current === 'rain' && rain.times.length) { showFrame(rain.idx ? rain.idx : rain.nowIdx); return; }
    renderPins();
  }

  // Tap a layer to turn it on, tap it again to turn it off (plain map).
  function setLayer(name) {
    current = current === name ? null : name;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layer === current)); });
    render();
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { setLayer(b.dataset.layer); }); });

  /* ---------- Tap the map for a point forecast ---------- */
  map.on('click', function (e) {
    var lat = e.latlng.lat.toFixed(3), lon = e.latlng.lng.toFixed(3);
    var p = L.popup().setLatLng(e.latlng).setContent('Loading…').openOn(map);
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=' + CURRENT)
      .then(function (r) { return r.json(); }).then(function (j) {
        var d = j.current, w = wx(d.weather_code);
        p.setContent('<div class="pop"><b>' + Math.round(d.temperature_2m) + '°C</b> ' + w[0] +
          '<div>Wind ' + Math.round(d.wind_speed_10m) + ' km/h, gusts ' + Math.round(d.wind_gusts_10m) + ' km/h</div>' +
          '<div>Rain now ' + d.precipitation + ' mm, cloud ' + d.cloud_cover + '%</div>' +
          '<div>' + lat + ', ' + lon + '</div></div>');
      }).catch(function () { p.setContent('No data for this point.'); });
  });

  /* ---------- Start ---------- */
  document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.layer === current)); });
  render();
  var cached = readCache();
  if (cached) {
    applyData(cached.all, cached.t);
  } else {
    setStatus('Loading weather…');
  }
  loadWeather();
  setInterval(loadWeather, REFRESH_MS);
})();
</script>
</body>
</html>

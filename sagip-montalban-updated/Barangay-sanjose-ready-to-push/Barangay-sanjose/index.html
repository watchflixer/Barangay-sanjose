<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HazardSync - Rizal Hazard & Water Level Map</title>
    <meta name="description" content="Disaster & Hazard Monitoring Portal for Rizal with live water level monitoring and verified incident reports." />
    <!-- OpenStreetMap's tile servers require a Referer ("403r Access blocked"
         otherwise). Keep the origin-only policy; every Leaflet tile layer also
         sets referrerPolicy on its own <img>, which wins over this default. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="HazardSync - Rizal Hazard & Water Level Map" />
    <meta property="og:description" content="Disaster & Hazard Monitoring Portal for Rizal with live water level monitoring and verified incident reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Leaflet's stylesheet is bundled from the installed package (Leaflet 2)
         in src/main.tsx, so no CDN copy is pinned here. -->
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

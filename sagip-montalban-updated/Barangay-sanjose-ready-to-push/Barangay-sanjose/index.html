<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HazardSync · Barangay San Jose</title>
    <meta name="description" content="Disaster & Hazard Monitoring Portal for Barangay San Jose, Rizal, with live water level monitoring and verified incident reports." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="HazardSync · Barangay San Jose" />
    <meta property="og:description" content="Disaster & Hazard Monitoring Portal for Barangay San Jose, Rizal, with live water level monitoring and verified incident reports." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e3a5f" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
      /* The top navbar is replaced by the sidebar header and the map controls. */
      #app-navbar { display: none !important; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Deep links from the map style picker (map-styles.html) use ?style=.
      // The choice is written to sessionStorage BEFORE the React app boots, so
      // MapViewer.readRefreshView() opens the right view directly
      // (main / traffic / flood / helpcenter / weather). Links are shareable.
      (function () {
        var VIEWS = {
          hazard: 'main', streets: 'main', main: 'main',
          help: 'helpcenter', helpcenter: 'helpcenter', satellite: 'helpcenter',
          weather: 'weather',
          flood: 'flood', floodprone: 'flood', light: 'flood',
          traffic: 'traffic', dark: 'traffic'
        };
        var id = new URLSearchParams(location.search).get('style');
        if (!id) return;
        var view = VIEWS[String(id).toLowerCase()];
        if (!view) return;
        try {
          window.sessionStorage.setItem('san-jose-refresh-view', view);
          window.sessionStorage.removeItem('san-jose-helpcenter-open');
          var picked = view === 'main' ? 'hazard' : view === 'helpcenter' ? 'help' : view;
          window.localStorage.setItem('hs-map-style', picked);
          window.localStorage.setItem('hs-map-last-view', picked);
        } catch (e) { /* private mode: the React app defaults to the Hazard Map */ }
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Preview - Barangay San Jose</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0f172a; font-family:system-ui; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:20px; color:white; }
    h1 { margin:20px 0 10px; font-size:18px; }
    p { opacity:0.7; font-size:13px; margin-bottom:20px; text-align:center; max-width:500px; }
    .phones { display:flex; gap:30px; flex-wrap:wrap; justify-content:center; }
    .phone { background:#000; border-radius:40px; padding:12px; box-shadow:0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 2px #333; position:relative; }
    .phone.highlight { box-shadow:0 0 0 2px #10b981, 0 20px 60px rgba(16,185,129,0.3), inset 0 0 0 2px #333; }
    .phone::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:100px; height:25px; background:#000; border-radius:0 0 16px 16px; z-index:40; }
    .screen { background:white; border-radius:30px; overflow:hidden; position:relative; }
    .screen iframe { border:0; display:block; background:white; }
    .label { text-align:center; margin-top:12px; font-size:12px; font-weight:600; letter-spacing:0.5px; opacity:0.8; }
    .label b { color:#10b981; }
    .controls { margin-top:30px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .controls a { background:#10b981; color:white; padding:10px 18px; border-radius:10px; text-decoration:none; font-size:13px; font-weight:600; }
    .controls a.secondary { background:#334155; }
  </style>
</head>
<body>
  <h1>📱 Barangay San Jose - Mobile Preview</h1>
  <p>Pixel 7 <b>412×915</b> ang default! Lahat responsive — may mobile menu at bottom sheets.</p>
  
  <div class="phones">
    <div>
      <div class="phone highlight">
        <div class="screen">
          <iframe src="/index.html" width="412" height="915" title="Pixel 7"></iframe>
        </div>
      </div>
      <div class="label"><b>★ Pixel 7 - 412 × 915 (default)</b></div>
    </div>

    <div>
      <div class="phone">
        <div class="screen">
          <iframe src="/index.html" width="375" height="667" title="iPhone SE"></iframe>
        </div>
      </div>
      <div class="label">iPhone SE - 375 × 667</div>
    </div>

    <div>
      <div class="phone">
        <div class="screen">
          <iframe src="/index.html" width="393" height="852" title="iPhone 14 Pro"></iframe>
        </div>
      </div>
      <div class="label">iPhone 14 Pro - 393 × 852</div>
    </div>

    <div>
      <div class="phone">
        <div class="screen">
          <iframe src="/index.html" width="360" height="800" title="Android"></iframe>
        </div>
      </div>
      <div class="label">Android - 360 × 800</div>
    </div>
  </div>

  <div class="controls">
    <a href="/pixel7-preview.html">Pixel 7 Only View (default)</a>
    <a href="/?full=1" target="_blank">Open Desktop App</a>
    <a class="secondary" href="javascript:location.reload()">Reload</a>
  </div>

  <script src="status-bar.js"></script>
  <script>
    (function () {
      // Every portrait phone frame gets a live status bar with the time.
      var frames = document.querySelectorAll('.screen iframe');
      Array.prototype.forEach.call(frames, function (frame) {
        var title = (frame.getAttribute('title') || '').toLowerCase();
        var os = title.indexOf('iphone') > -1 || title.indexOf('ipad') > -1 || title.indexOf('apple') > -1 ? 'ios' : 'android';
        var bar = window.HSStatusBar.height(os);
        var h = parseInt(frame.getAttribute('height') || frame.clientHeight, 10);
        var screen = frame.parentNode;
        screen.style.height = h + 'px';
        frame.setAttribute('height', h - bar);
        frame.style.height = (h - bar) + 'px';
        frame.style.marginTop = bar + 'px';
        window.HSStatusBar.mount(screen, {os: os});
      });
    })();
  </script>
</body>
</html>

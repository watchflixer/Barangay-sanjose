<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizal Realtime Traffic Map</title>

<!-- Mapbox GL JS — real live traffic via the traffic-day-v2 style -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<!-- Leaflet 1.9.4 stylesheet: the Traffic layer reuses Leaflet's real
     .leaflet-bar zoom markup so the control renders pixel-identical to the
     Flood Prone map. Only the .leaflet-* rules apply here; the Mapbox canvas
     is unaffected. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />

<!-- ===== Destination search =============================================
     traffic-places.js — the barangay's own list of subdivisions, phases and
                         sitios (Mapbox/Google do not know these).
     traffic-search.js — merges that list with Mapbox + Photon + Nominatim.
     Keep traffic-places.js up to date: it is what makes "Blk 4 Phase 1A
     Sub-Urban" findable. See the header of that file for how to add places.
     ==================================================================== -->
<script src="traffic-places.js"></script>
<script src="traffic-search.js"></script>
<style>
  :root{
    --line:#d4d8d4;
    --ink:#1b2a2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;}
  /* Zoom buttons: the exact markup/classes Leaflet 1.9.4 generates
     (.leaflet-top.leaflet-left > .leaflet-control.leaflet-bar), so the
     Leaflet stylesheet above gives identical size, margin and look as the
     Flood Prone map. The slot rule below is copied from that map. */
  .leaflet-top.leaflet-left{top:132px;left:6px;}
  /* Hide the zoom buttons while a route is on screen (the bottom sheet + top
     card already own the layout, like Google Maps during navigation) and
     while the full-screen Directions screen is open. */
  body.routing .leaflet-top.leaflet-left,
  body.directions-open .leaflet-top.leaflet-left{display:none;}
  /* Base map switcher: same slot the Flood Prone map's layers control uses */
  #base-switch{
    position:absolute;top:10px;right:12px;
    display:flex;gap:4px;
    background:rgba(255,255,255,0.95);border:1px solid var(--line);border-radius:8px;
    padding:4px;z-index:400;box-shadow:0 2px 6px rgba(0,0,0,0.15);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #base-switch button{
    border:1px solid transparent;border-radius:5px;background:transparent;
    padding:4px 10px;font-size:0.72rem;font-weight:700;letter-spacing:0.02em;
    color:#33413a;cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  #base-switch button:hover{background:#eef1ec;}
  #base-switch button.active{background:#111827;color:#ffffff;}
  /* Bottom-right stack: Directions button sits directly above the legend card */
  #legend-stack{
    position:absolute;right:12px;bottom:24px;z-index:400;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }
  #directions-btn{
    display:block;width:48px;height:48px;padding:0;border:0;border-radius:14px;
    background:#0b7a87;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.3);
    transition:transform .12s ease,box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #directions-btn svg{display:block;width:100%;height:100%;}
  #directions-btn:hover{box-shadow:0 3px 10px rgba(0,0,0,0.35);}
  #directions-btn:active{transform:scale(.94);}
  #directions-btn:focus-visible{outline:3px solid #ffffff;outline-offset:-6px;}
  #legend{
    min-width:150px;
    background:rgba(244,246,244,0.95);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.78rem;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  #legend .row{display:flex;align-items:center;gap:6px;margin:3px 0;}
  #legend .sw{width:13px;height:13px;border-radius:2px;display:inline-block;}
  /* Raise the stack on mobile portrait so it clears the parent app's bottom overlays */
  @media (orientation: portrait) and (max-width: 640px){
    #legend-stack{ bottom: 56px; }
  }
  #notice{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    max-width:calc(100% - 90px);
    background:rgba(122,31,27,0.92);color:#fff;border-radius:8px;
    padding:8px 14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.75rem;line-height:1.35;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,0.25);
    display:none;text-align:center;
  }
  /* Parent app's "Show your location" drops this pulsing blue dot on the traffic map */
  .traffic-user-marker{background:transparent;border:0;}
  .traffic-user-dot{
    display:block;width:18px;height:18px;margin:3px;
    border:3px solid #ffffff;border-radius:50%;
    background:#1a73e8;
    box-shadow:0 0 0 7px rgba(26,115,232,.22),0 2px 8px rgba(15,23,42,.45);
    position:relative;
  }
  .traffic-user-dot::after{
    content:"";position:absolute;inset:-14px;border-radius:50%;
    border:2px solid rgba(26,115,232,.55);
    animation:trafficUserPulse 1.6s ease-out infinite;
  }
  @keyframes trafficUserPulse{
    0%{transform:scale(.45);opacity:1;}
    70%{transform:scale(1.15);opacity:0;}
    100%{transform:scale(1.15);opacity:0;}
  }

  /* ===== Directions screen (Google Maps-style) ===== */
  #dir-panel{position:absolute;inset:0;z-index:1500;background:#fff;display:flex;flex-direction:column;
    font-family:"Google Sans",Roboto,-apple-system,"Segoe UI",sans-serif;color:#202124;}
  #dir-panel[hidden]{display:none;}
  #dir-panel button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;}
  #dir-panel svg{display:block;}
  .dir-top{display:flex;align-items:flex-start;gap:4px;padding:16px 12px 0 8px;}
  .dir-ib{width:40px;height:40px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .dir-ib:active{background:#e8eaed;}
  .dir-dots{position:relative;width:24px;height:88px;flex:none;}
  .dir-dots i{position:absolute;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#9aa0a6;}
  .dir-dots .b{position:absolute;left:2px;top:8px;width:20px;height:20px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;}
  .dir-dots .b:after{content:"";width:10px;height:10px;border-radius:50%;background:#1a73e8;}
  /* Origin that is NOT the user's GPS location: blank hollow circle in the
     Directions panel too — blue stays only for "Your location". */
  #dir-panel.from-not-user .dir-dots .b{background:#f1f3f4;}
  #dir-panel.from-not-user .dir-dots .b:after{background:transparent;box-shadow:inset 0 0 0 2px #bdc1c6;}
  .dir-dots .p{position:absolute;left:0;top:56px;color:#d93025;}
  .dir-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .dir-fields input{width:100%;height:40px;border:1px solid #c4c7c5;border-radius:8px;padding:0 12px;font:400 16px/1 inherit;font-family:inherit;color:#202124;background:#fff;outline:none;}
  .dir-fields input::placeholder{color:#757575;}
  .dir-fields input:focus{border:2px solid #1a73e8;padding:0 11px;}
  .dir-fields input.is-user{color:#1a73e8;}
  #dir-swap{align-self:center;margin-left:4px;}
  .dir-modes{display:flex;justify-content:space-around;padding:14px 20px 12px;border-bottom:1px solid #dadce0;}
  .dir-modes button{width:60px;height:36px;border:0;border-radius:18px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .dir-modes button.on{background:#a6dbe8;}
  #dir-hint{padding:8px 16px;font-size:.8rem;color:#b3261e;background:#fdf3f2;}
  #dir-hint:empty{display:none;}
  #dir-body{flex:1;overflow-y:auto;}
  .dir-sc-row{display:flex;overflow-x:auto;border-bottom:8px solid #f1f3f4;}
  .dir-sc{display:flex;align-items:center;gap:10px;padding:14px 12px;border:0;background:transparent;cursor:pointer;text-align:left;flex:none;border-right:1px solid #dadce0;}
  .dir-sc:last-child{border-right:0;}
  .dir-sc-ic,.dir-row-ic{width:44px;height:44px;border-radius:50%;background:#d7ebee;display:flex;align-items:center;justify-content:center;flex:none;color:#202124;}
  .dir-sc-ic.o{background:#fff;border:1px solid #c4c7c5;}
  .dir-sc-tx,.dir-row-tx{display:flex;flex-direction:column;min-width:0;}
  .dir-sc-title{font-size:16px;}
  .dir-sc-sub.eta{color:#188038;}
  .dir-sc-sub{font-size:14px;color:#5f6368;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dir-sec{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px;font-size:15px;font-weight:500;}
  .dir-sec svg{color:#5f6368;}
  .dir-row{display:flex;align-items:center;gap:16px;width:100%;padding:10px 20px;border:0;background:transparent;text-align:left;cursor:pointer;}
  .dir-row:active,.dir-sc:active{background:#f1f3f4;}
  .dir-row-ic{background:#e8eaed;}
  .dir-row-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dir-row-sub{font-size:14px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dir-more{display:block;margin:8px auto;padding:10px 16px;border:0;background:transparent;color:#00796b;font-size:16px;cursor:pointer;}
  .dir-empty{padding:16px 20px;font-size:14px;color:#5f6368;}
  /* --- smarter destination search: badges, distance, attribution --- */
  .dir-row-main{display:flex;align-items:center;gap:6px;min-width:0;}
  .dir-row-main .dir-row-title{flex:1 1 auto;min-width:0;}
  .dir-badge{flex:none;font-size:10px;font-weight:700;letter-spacing:.2px;padding:1px 5px;border-radius:4px;background:#e8f0fe;color:#1a73e8;text-transform:uppercase;}
  .dir-badge.osm{background:#e6f4ea;color:#137333;}
  .dir-badge.approx{background:#fef7e0;color:#b06000;}
  .dir-cat{display:flex;align-items:center;gap:6px;padding:10px 20px 4px;font-size:13px;color:#137333;font-weight:600;}
  .dir-attr{padding:12px 20px 18px;font-size:11px;color:#80868b;line-height:1.45;}
  .dir-attr a{color:#80868b;}
  .dir-hint{padding:10px 20px 14px;font-size:12.5px;color:#b06000;background:#fef7e0;line-height:1.45;}

  /* ===== Route view (Google Maps-style) ===== */
  [hidden]{display:none!important;}
  .rt{display:none;font-family:"Google Sans",Roboto,-apple-system,"Segoe UI",sans-serif;color:#202124;}
  body.routing .rt{display:block;}
  body.routing #legend-stack,body.routing #base-switch{display:none;}
  body.routing #notice{top:132px;}
  .rt svg{display:block;} .rt button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;}
  /* Only show the route-view chrome once a route actually exists (body.routing).
     These two IDs must NOT set display in their own rules: an ID selector
     (1-0-0) outranks .rt (0-1-0), so they stayed visible on the plain traffic
     map before any destination was picked. The routing-scoped rules below
     (1-1-1) win only while a route is on screen. */
  #rt-top{position:absolute;z-index:1200;top:12px;left:20px;right:20px;max-width:440px;margin:0 auto;background:#fff;border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:6px 6px 6px 14px;align-items:center;gap:4px;}
  #rt-edit{flex:1;min-width:0;display:flex;gap:10px;cursor:pointer;}
  #rt-edit .dc{position:relative;width:24px;flex:none;}
  #rt-edit .dc .b{position:absolute;left:2px;top:14px;width:20px;height:20px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;}
  #rt-edit .dc .b:after{content:"";width:10px;height:10px;border-radius:50%;background:#1a73e8;}
  /* Origin that is NOT the user's GPS location shows a blank circle —
     gray ring, no blue fill (blue stays only for "Your location"). */
  #rt-edit.from-not-user .dc .b{background:#f1f3f4;}
  #rt-edit.from-not-user .dc .b:after{background:transparent;box-shadow:inset 0 0 0 2px #bdc1c6;}
  #rt-edit .dc .p{position:absolute;left:0;top:64px;color:#d93025;}
  #rt-edit .dc i{position:absolute;left:11px;width:3px;height:3px;border-radius:50%;background:#9aa0a6;}
  #rt-edit .tx{flex:1;min-width:0;}
  #rt-edit .r{height:48px;display:flex;align-items:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #rt-edit .r + .r{border-top:1px solid #dadce0;}
  #rt-from{color:#1a73e8;} #rt-to small{color:#5f6368;font-size:13px;margin-left:8px;}
  #rt-side{display:flex;flex-direction:column;justify-content:space-between;height:96px;}
  .rt-ib{width:40px;height:40px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .rt-ib:active{background:#e8eaed;}
  #rt-layers{position:absolute;z-index:1200;right:12px;top:124px;width:40px;height:40px;border:0;border-radius:12px;background:#c7e8f1;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;align-items:center;justify-content:center;}
  /* While a route is on screen, reveal the flex layouts gated by .rt.
     #rt-layers (the light-blue map-type button) is intentionally NOT listed:
     the Street/Satellite switcher is hidden in route view anyway, so it only
     added clutter next to the top card. */
  body.routing #rt-top,body.routing #rt-locate,body.routing #rt-layers2{display:flex;}
  /* (1-1-1) beats the generic body.routing .rt rule that would otherwise
     render it as a block button. */
  body.routing #rt-layers{display:none;}
  #rt-menu{position:absolute;z-index:1300;top:62px;right:26px;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);padding:6px 0;min-width:190px;}
  #rt-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 18px;font-size:16px;cursor:pointer;}
  #rt-menu button:active{background:#f1f3f4;}
  #rt-sheet{position:absolute;z-index:1200;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);padding-top:16px;}
  #rt-sheet:before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#c4c7c5;}
  #rt-locate{position:absolute;right:12px;top:-64px;width:48px;height:48px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #rt-locate span{width:32px;height:32px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;}
  #rt-locate span:after{content:"";width:14px;height:14px;border-radius:50%;background:#1a73e8;border:2px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1px #1a73e8;}
  /* NEW: Layers button directly above the My Location FAB — same white rounded style, visible in route view */
  #rt-layers2{position:absolute;right:12px;top:-124px;width:48px;height:48px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #rt-layers2 svg{width:22px;height:22px;color:#3c4043;}
  .rt-head{display:flex;align-items:center;padding:6px 16px 8px 20px;gap:10px;}
  #rt-title{flex:1;font-size:23px;font-weight:500;}
  .rt-cb{width:44px;height:44px;border:0;border-radius:50%;background:#e9eef0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .rt-cb:active{background:#d5dde0;}
  .rt-tabs{display:flex;border-bottom:1px solid #dadce0;}
  .rt-tab{flex:1;min-width:0;position:relative;border:0;background:transparent;padding:14px 0 16px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;cursor:pointer;}
  .rt-tab.on{color:#0e6e80;}
  .rt-tab.on:after{content:"";position:absolute;left:50%;bottom:-1px;width:60px;height:3px;margin-left:-30px;border-radius:3px 3px 0 0;background:#0e6e80;}
  .rt-sum{padding:12px 20px 12px;border-bottom:1px solid #dadce0;}
  #rt-time{font-size:23px;color:#188038;} #rt-dist{font-size:23px;color:#3c4043;}
  #rt-sub{font-size:15px;color:#5f6368;margin-top:4px;}
  #rt-gas{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:16px;color:#5f6368;}
  #rt-gas svg{color:#188038;width:18px;height:18px;}
  .rt-lbl svg{display:inline-block!important;vertical-align:-2px;margin-left:6px;width:15px;height:15px;color:#188038;}
  .rt-lbl.sel svg{color:#fff;}
  .rt-chips{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 16px;}
  .rt-chip{flex:none;height:44px;padding:0 18px 0 14px;border:0;border-radius:22px;background:#d3eef5;font-size:17px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .rt-chip.go{background:#00697a;color:#fff!important;}
  .rt-chip:active{filter:brightness(.93);}
  .rt-lbl{background:#fff;color:#202124;border-radius:10px;padding:6px 10px;font:500 15px "Google Sans",Roboto,sans-serif;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;}
  .rt-lbl.sel{background:#1c1fb8;color:#fff;}
  .rt-stop{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #6b7280;box-sizing:border-box;box-shadow:0 1px 4px rgba(0,0,0,.4);}
  #rt-opts{position:absolute;z-index:1400;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-family:"Google Sans",Roboto,sans-serif;}
  #rt-opts .card{background:#fff;border-radius:20px;padding:20px 24px;width:300px;max-width:calc(100% - 40px);}
  #rt-opts h3{margin:0 0 8px;font-size:20px;font-weight:500;}
  #rt-opts label{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:16px;}
  #rt-opts input{width:20px;height:20px;accent-color:#00697a;}
  #rt-opts .done{margin-top:8px;width:100%;height:44px;border:0;border-radius:22px;background:#00697a;color:#fff;font-size:16px;cursor:pointer;}

  /* ===== On-site Navigation banner + compact sheet while navigating ===== */
  #nav-steps{position:absolute;z-index:1260;top:calc(10px + env(safe-area-inset-top, 0px));left:12px;right:12px;max-width:440px;margin:0 auto;
    background:#fff;color:#202124;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.35);
    padding:12px 14px;display:none;align-items:center;gap:12px;font-family:"Google Sans",Roboto,sans-serif;}
  body.navigating #nav-steps{display:flex;}
  #nav-steps .nav-arrow{width:36px;height:36px;border-radius:10px;background:#e8f0fe;color:#1a73e8;display:flex;align-items:center;justify-content:center;flex:none;}
  #nav-steps .nav-tx{flex:1;min-width:0;}
  #nav-steps .nav-step-text{font-size:15px;font-weight:600;line-height:1.25;}
  #nav-steps .nav-step-next{font-size:11.5px;color:#5f6368;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #nav-steps .nav-step-dist{font-size:15px;font-weight:700;flex:none;}
  #nav-banner{position:absolute;z-index:1250;top:calc(66px + env(safe-area-inset-top, 0px));left:12px;right:12px;max-width:440px;margin:0 auto;
    background:#0b7a87;color:#fff;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.35);
    padding:12px 14px;display:none;align-items:center;gap:10px;font-family:"Google Sans",Roboto,sans-serif;}
  body.navigating #nav-banner{display:flex;}
  body.navigating #rt-sheet .rt-chips,body.navigating #rt-sheet .rt-tabs,body.navigating #rt-sheet .rt-sum,body.navigating #rt-top{display:none!important;}
  body.navigating #dir-panel{display:none!important;}
  #nav-banner .nav-eta{font-size:24px;font-weight:700;line-height:1.1;}
  #nav-banner .nav-dist{font-size:12px;opacity:.9;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #nav-banner #nav-exit{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer;flex:none;}
  #nav-banner #nav-exit:active{background:rgba(255,255,255,.3);}
  #nav-banner .nav-mini{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:600;padding:8px 11px;cursor:pointer;flex:none;}
  #nav-banner .nav-mini:active{background:rgba(255,255,255,.3);}
  #nav-pills{position:absolute;z-index:1255;top:calc(132px + env(safe-area-inset-top, 0px));left:12px;right:12px;max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:6px;pointer-events:none;font-family:"Google Sans",Roboto,sans-serif;}
  .nav-pill{background:#fff8e1;border:1px solid #f9ab00;color:#7a5c00;border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;display:flex;}
  .nav-pill.traffic{background:#e8f0fe;border-color:#a8c7fa;color:#174ea6;}

    /* ===== Fare / Pamasahe Card — bigger than route options ===== */

  #rt-fare .fare-ic.plane, #rt-driver .fare-ic.plane{background:#f1f3f4;color:#202124;}

  /* ============================================================

     Sizing-only: same layout, elements and behavior as desktop.
     ============================================================ */
  @media (orientation: portrait) and (max-width: 640px){
    /* --- Top origin/destination card: previous COMPACT size, but the
         full desktop look stays (blue dot, gray dots between rows,
         divider line, red pin, ⋮ and ⇅ buttons) --- */
    #rt-top{top:8px;left:12px;right:12px;max-width:none; padding:4px 4px 4px 10px; border-radius:18px;}
    #rt-edit{gap:5px;padding-left:0;}
    #rt-edit .r{height:32px;font-size:13.5px;}
    #rt-edit .dc{width:18px;}
    #rt-edit .dc .b{left:0;top:7px; width:16px; height:16px;}
    #rt-edit .dc .b:after{width:7px;height:7px;}
    #rt-edit .dc .p{left:0;top:39px;transform:scale(.75);transform-origin:left top;}
    /* Re-center the gray connector dots on the 32px-row boundary */
    #rt-edit .dc i{left:7.5px !important; width:2px; height:2px;}
    #rt-edit .dc i:nth-of-type(1){top:28px !important;}
    #rt-edit .dc i:nth-of-type(2){top:31px !important;}
    #rt-edit .dc i:nth-of-type(3){top:34px !important;}
    #rt-side{height:64px; gap:2px;}
    .rt-ib{width:32px;height:32px;}

    /* --- Bottom sheet: compact like the screenshot --- */

    #rt-title{font-size:19px;font-weight:600;}
    .rt-cb{width:38px;height:38px;}
    .rt-cb svg{width:19px;height:19px;}
    .rt-tabs{border-bottom-width:1px;}
    .rt-tab{padding:9px 0 10px;font-size:13px;gap:5px;}
    .rt-tab b svg{width:17px;height:17px;}
    .rt-tab.on:after{width:40px;height:3px;margin-left:-20px;}
    .rt-sum{padding:9px 20px 10px;}
    #rt-time,#rt-dist{font-size:19px;}
    #rt-sub{font-size:13px;margin-top:3px;}
    #rt-gas{font-size:13px;margin-top:6px;gap:6px;}
    #rt-gas svg{width:14px;height:14px;}
    .rt-chips{padding:10px 14px calc(12px + env(safe-area-inset-bottom, 0px));gap:8px;}
    .rt-chip{height:40px;border-radius:20px;font-size:14px;padding:0 14px 0 11px;gap:7px;}
    .rt-chip.go{padding:0 16px 0 13px;}
    .rt-chip svg{width:16px;height:16px;}
    .rt-chip span{display:inline-flex;align-items:center;}
    .rt-chip span svg{flex:none;}

    /* --- My-location FAB above the sheet --- */
    #rt-locate{width:44px;height:44px;top:-58px;right:12px;border-radius:13px;}
    #rt-locate span{width:28px;height:28px;}
    #rt-locate span:after{width:12px;height:12px;}
    /* --- Layers FAB directly above My-location --- */
    #rt-layers2{width:44px;height:44px;top:-114px;right:12px;border-radius:13px;}
    #rt-layers2 svg{width:20px;height:20px;}

    /* --- Duration chips floating on the route --- */
    .rt-lbl{padding:5px 9px;font-size:13px;border-radius:9px;}
    .rt-lbl svg{width:12px;height:12px;}

    /* --- Route options dialog --- */
    #rt-opts .card{width:calc(100% - 48px);max-width:320px;border-radius:20px;}
    #rt-opts h3{font-size:18px;}
    #rt-opts label{font-size:14px;padding:11px 0;}
    #rt-opts .done{height:42px;font-size:14px;border-radius:21px;}

    /* --- Directions screen: centered back-button + origin/destination
         group, and Google Maps sizing for Home / Work / More --- */
    .dir-top{max-width:480px;margin:0 auto;gap:8px;padding:10px 8px 0;}
    #dir-back{margin-top:1px; width:36px; height:36px;} /* smaller back button for Pixel 7 375x820 */
    .dir-fields{gap:6px;}
    .dir-fields input{height:38px;border-radius:8px;font-size:14px;padding:0 12px;}
    .dir-fields input:focus{padding:0 11px;}
    .dir-dots{height:82px; width:20px;} /* 2 × 38px inputs + 6px gap */
    .dir-dots .b{top:9px; left:2px; width:16px; height:16px;}
    .dir-dots .b:after{width:8px;height:8px;}
    .dir-dots .p{top:54px; transform:scale(0.85); transform-origin:left top;}
    .dir-dots i:nth-of-type(1){top:36px !important;}
    .dir-dots i:nth-of-type(2){top:41px !important;}
    .dir-dots i:nth-of-type(3){top:46px !important;}
    #dir-swap{width:36px;height:36px;}
    .dir-modes{padding:13px 16px 11px;}
    .dir-modes button{width:64px;height:40px;}
    .dir-sc{gap:10px;padding:10px 12px;}
    .dir-sc-ic,.dir-row-ic{width:36px;height:36px;}
    .dir-sc-ic svg,.dir-row-ic svg{width:18px;height:18px;}
    .dir-sc-title{font-size:13.5px; line-height:1.2;}
    .dir-sc-sub{font-size:11px;max-width:96px; line-height:1.2;}
    .dir-sec{font-size:14px;font-weight:500;padding:14px 16px 8px;}

    /* Recent list rows — compact for Pixel 7 375x820 */
    .dir-row{position:relative;padding:10px 14px;gap:12px;}
    .dir-row::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:#e8eaed;}
    .dir-row:last-of-type::after{display:none;}
    .dir-row-title{font-size:14px; line-height:1.25;}

    /* Fare card — bigger on mobile, optimized for Pixel 7 375x820 */
    #rt-fare .fare-head{padding:12px 12px 8px;}

  /* Extra-small phones (iPhone SE / 320px Androids) — tighten further */
  @media (orientation: portrait) and (max-width: 360px){

</style>

<body>
<div id="map"></div>
<div class="leaflet-top leaflet-left">
  <div id="traffic-zoom" class="leaflet-control-zoom leaflet-bar leaflet-control">
    <a class="leaflet-control-zoom-in" href="#" title="Zoom in" role="button" aria-label="Zoom in">+</a>
    <a class="leaflet-control-zoom-out" href="#" title="Zoom out" role="button" aria-label="Zoom out">&minus;</a>
  </div>
</div>
<div id="base-switch">
  <button type="button" data-base="traffic" class="active">Street</button>
  <button type="button" data-base="satellite">Satellite</button>
</div>
<div id="notice"></div>
<div id="legend-stack">
  <button type="button" id="directions-btn" title="Directions" aria-label="Directions">
    <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="17" y="17" width="22" height="22" rx="3.5" transform="rotate(45 28 28)" fill="#ffffff"/>
      <path d="M23.5 34v-6.5a3 3 0 0 1 3-3H31" fill="none" stroke="#0b7a87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30.5 19.8L36 24.5l-5.5 4.7z" fill="#0b7a87" transform="translate(-0.5 0)"/>
    </svg>
  </button>
  <div id="legend">
    <div class="row"><span class="sw" style="background:#2BC82B;"></span>Free flowing</div>
    <div class="row"><span class="sw" style="background:#F1BF40;"></span>Slow traffic</div>
    <div class="row"><span class="sw" style="background:#CC0704;"></span>Heavy congestion</div>
    <div class="row"><span class="sw" style="background:#7A1F1B;"></span>Road closed</div>
  </div>
</div>
<div id="dir-panel" hidden>
  <div class="dir-top">
    <button type="button" class="dir-ib" id="dir-back" aria-label="Back" data-i="back"></button>
    <div class="dir-dots"><span class="b"></span><i style="top:34px"></i><i style="top:41px"></i><i style="top:48px"></i><span class="p" data-i="pin"></span></div>
    <div class="dir-fields">
      <input id="dir-from" type="text" autocomplete="off" aria-label="Starting point" placeholder="Choose starting point">

    <button type="button" class="dir-ib" id="dir-swap" aria-label="Swap" data-i="swap"></button>
  </div>
  <div class="dir-modes">
    <button type="button" data-mode="car" class="on" aria-label="Car" data-i="car"></button>
    <button type="button" data-mode="moto" aria-label="Motorcycle" data-i="moto"></button>
    <button type="button" data-mode="transit" aria-label="Public transport" data-i="transit"></button>
    <button type="button" data-mode="walk" aria-label="Walking" data-i="walk"></button>
  </div>
  <div id="dir-hint"></div>
  <div id="dir-body"></div>
</div>
<div id="rt-top" class="rt">
  <div id="rt-edit">
    <div class="dc"><span class="b"></span><i style="top:44px"></i><i style="top:51px"></i><i style="top:58px"></i><span class="p" data-i="pin"></span></div>
    <div class="tx"><div class="r" id="rt-from">Your location</div><div class="r" id="rt-to"></div></div>
  </div>
  <div id="rt-side">
    <button type="button" class="rt-ib" id="rt-dots" aria-label="More options" data-i="dots"></button>

  </div>
</div>
<div id="rt-menu" class="rt" hidden></div>
<button type="button" id="rt-layers" class="rt" aria-label="Map type" data-i="layers"></button>
<div id="rt-sheet" class="rt">
  <button type="button" id="rt-layers2" class="rt" aria-label="Layers" data-i="layers"></button>
  <button type="button" id="rt-locate" aria-label="My location"><span></span></button>
  <div class="rt-head"><div id="rt-title">Drive</div>
    <button type="button" class="rt-cb" id="rt-tune" aria-label="Route options" data-i="tune"></button>
    <button type="button" class="rt-cb" id="rt-pricing" aria-label="Fare" data-i="ticket"></button>
    <button type="button" class="rt-cb" id="rt-share" aria-label="Driver" data-i="pricing"></button>
    <button type="button" class="rt-cb" id="rt-close" aria-label="Close" data-i="close"></button></div>

<!-- Fare Estimate Card — plain, vehicles only -->
<div id="rt-fare" hidden>

  const store = {

  const panel = $('dir-panel'), fromIn = $('dir-from'), toIn = $('dir-to'), body = $('dir-body');
  let mode = 'car', from = { user: true }, to = null, active = 'to', pendingSave = null, showAll = false;
  let userLoc = null, results = [], searching = false, searchErr = false, seq = 0, timer = null;
  let searchHint = '', searchCat = null, pinSeq = 0;
  let recent = store.get('traffic_recent', []);
  const saved = { home: store.get('traffic_home', null), work: store.get('traffic_work', null) };
  const dirty = { from: false, to: false };
  const setHint = (t) => { $('dir-hint').textContent = t || ''; };
  const tellParent = (open) => { try { window.parent.postMessage({ type: open ? 'traffic-directions-open' : 'traffic-directions-close' }, '*'); } catch (e) {} };

  // Live drive time from your location to Home / Work, shown in green like Google Maps.
  const eta = {};
  async function loadEta(k) {
    const p = saved[k]; if (!p) return;

        const st = navigator.permissions && (await navigator.permissions.query({ name: 'geolocation' }));
        if (!st || st.state !== 'granted') return; // never trigger a permission prompt just for this
        await getUserLoc();
      }
      const url = 'https://api.mapbox.com/directions/v5/mapbox/driving-traffic/' + userLoc.lng + ',' + userLoc.lat + ';' + p.lng + ',' + p.lat +

      const r = ((await (await fetch(url)).json()).routes || [])[0]; if (!r) return;
      const m = Math.max(1, Math.round(r.duration / 60));
      eta[k] = m < 60 ? m + 'm' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
      if (!panel.hidden && !dirty[active]) renderBody();
    } catch (e) {}
  }
  function setUserFrom() { from = { user: true }; fromIn.value = 'Your location'; fromIn.classList.add('is-user'); syncDirDot(); }

  $('dir-back').addEventListener('click', closePanel);

  panel.querySelectorAll('.dir-modes button').forEach((b) => b.addEventListener('click', () => {
    mode = b.dataset.mode;

  const fieldOf = (k) => (k === 'to' ? toIn : fromIn);
  function onFocus(k) { active = k; if (k === 'from') fromIn.select(); renderBody(); }
  function onInput(k) {

  }
  toIn.addEventListener('focus', () => onFocus('to'));
  fromIn.addEventListener('focus', () => onFocus('from'));
  toIn.addEventListener('input', () => onInput('to'));
  fromIn.addEventListener('input', () => {
    // Emptying the origin field instantly restores "Your location": the text
    // comes back, the dot turns blue again, and the text stays selected so

    if (!fromIn.value.trim() && !addingStop) {

  // ===== Destination search =============================================
  // Three layers, merged locally (see traffic-search.js for the details):
  //   1. the barangay's own gazetteer (traffic-places.js) — instant, offline,
  //      knows every subdivision / phase / sitio / blk that Google and Mapbox
  //      do NOT have;
  //   2. Mapbox — addresses, buildings, business names;
  //   3. Photon + Nominatim (OpenStreetMap) — the widest net of all.
  // A long query like "blk 4 phase 1a sub-urban sanjose rodriguez rizal" is
  // reduced to its place words ("phase 1a sub urban") before hitting the
  // online providers, so the junk words no longer bury the real answer.
  const RESULT_ICONS = {
    subdivision:'subdivision', sitio:'pin', barangay:'gov', town:'gov', landmark:'pin',
    gov:'gov', school:'school', health:'health', shop:'shop', worship:'worship',
    transport:'transit', road:'pin', poi:'pin', address:'pin', place:'pin', locality:'pin',
    neighborhood:'subdivision', postcode:'pin', district:'pin', region:'pin', street:'pin'
  };
  const iconFor = (r) => RESULT_ICONS[r.k] || (r.icon || 'pin');
  const mapCenter = () => ({ lat: map.getCenter().lat, lng: map.getCenter().lng });

  function runSearch(q, immediate) {
    const my = ++seq;
    const text = (q || '').trim();
    searchErr = false; searchHint = ''; searchCat = null;
    if (text.length < 2) { results = []; searching = false; dirty[active] = false; renderBody(); return; }
    const prox = mapCenter();
    // 1) Local gazetteer results — shown on the very next frame, no waiting.
    results = TrafficSearch.localSearch(text, prox, 10);
    searching = true;
    renderBody();
    // 2) Online results, merged and re-ranked when they arrive.
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        const out = await TrafficSearch.search(text, { token: mapboxgl.accessToken, proximity: prox });
        if (my !== seq) return;
        results = out.results; searchHint = out.hint || ''; searchCat = out.category || null;
        searching = false; searchErr = !results.length && !out.online;
      } catch (e) {
        if (my !== seq) return;
        searching = false; searchErr = !results.length;
      }
      renderBody();
    }, immediate ? 0 : 320);
  }

  // The local list, Photon and Nominatim all carry OpenStreetMap-derived data,
  // so the ODbL credit is always shown alongside the results.
  function attribution(rr) {
    const has = (s) => rr.some((r) => r.src === s);
    const parts = ['<a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>'];
    if (has('local')) parts.unshift('Barangay San Jose place list');
    if (has('mapbox')) parts.push('Mapbox');
    return parts.join(' · ');
  }

  function resultRow(r) {
    const el = h('button', 'dir-row'); el.type = 'button';
    const ic = h('span', 'dir-row-ic'); ic.innerHTML = svg(iconFor(r), 22); el.appendChild(ic);
    const tx = h('span', 'dir-row-tx');
    const main = h('span', 'dir-row-main');
    main.appendChild(h('span', 'dir-row-title', r.label));
    if (r.approx) main.appendChild(h('span', 'dir-badge approx', 'approx'));
    if (r.src === 'photon' || r.src === 'nominatim') main.appendChild(h('span', 'dir-badge osm', 'OSM'));
    tx.appendChild(main);
    const bits = [r.sub];
    if (r.dist != null && isFinite(r.dist) && r.dist < 100000) bits.push(TrafficSearch.fmtDist(r.dist));
    const sub = bits.filter(Boolean).join(' · ');
    if (sub) tx.appendChild(h('span', 'dir-row-sub', sub));
    el.appendChild(tx);
    el.addEventListener('click', () => applyPlace(r));
    return el;
  }

  // Quick-pick list of real places near the map centre (empty state only).
  function quickPlaces(n) {
    const list = window.TRAFFIC_PLACES || [];
    const c = mapCenter();
    const near = list.map((p) => ({ p, d: TrafficSearch.haversine(c.lat, c.lng, p.lat, p.lng) }))
      .filter((x) => x.p.k !== 'road' && x.d < 15000)
      .sort((a, b) => a.d - b.d).slice(0, n);
    return near.map((x) => ({ label: x.p.n, sub: x.p.c || '', lat: x.p.lat, lng: x.p.lng, k: x.p.k, src: 'local', dist: x.d }));
  }

  function row(icon, title, sub, fn) {
    const r = h('button', 'dir-row'); r.type = 'button';
    const ic = h('span', 'dir-row-ic'); ic.innerHTML = svg(icon, 22); r.appendChild(ic);
    const tx = h('span', 'dir-row-tx'); tx.appendChild(h('span', 'dir-row-title', title));
    if (sub) tx.appendChild(h('span', 'dir-row-sub', sub));
    r.appendChild(tx); r.addEventListener('click', fn); return r;
  }
  function shortcut(icon, label, subText, cls, fn) {
    const b = h('button', 'dir-sc'); b.type = 'button';
    const ic = h('span', 'dir-sc-ic' + (cls ? ' ' + cls : '')); ic.innerHTML = svg(icon, 22); b.appendChild(ic);
    const tx = h('span', 'dir-sc-tx'); tx.appendChild(h('span', 'dir-sc-title', label));
    if (subText) tx.appendChild(h('span', 'dir-sc-sub', subText));
    b.appendChild(tx); b.addEventListener('click', fn); return b;
  }
  const userRow = () => row('pin', 'Your location', '', () => { if (active === 'from') { setUserFrom(); dirty.from = false; results = []; if (to) go(); else { renderBody(); toIn.focus(); } } else { to = { user: true }; toIn.value = 'Your location'; if (from) go(); } });

  // ===== Tap the map to pin an exact spot ================================
  // No address database has every "Blk 4 Phase 1A" — but the resident knows
  // where it is. While the destination box is open, tapping the map drops the
  // pin there and reverse-geocodes the nearest name for it (Google Maps does
  // the same on long-press).
  map.on('click', (e) => {
    if (panel.hidden || routeActive) return;
    const hit = map.queryRenderedFeatures(e.point, { layers: ['alt-hit'] });
    if (hit && hit.length) return;                       // tapping another route line
    pinFromMap(e.lngLat.lat, e.lngLat.lng);
  });

  async function pinFromMap(lat, lng) {
    const my = ++pinSeq;
    const mySeq = seq;                    // stale if the user keeps typing meanwhile
    const field = active;                 // remember which box we are filling
    flash('Kinukuha ang lokasyon…', 1600);
    let place;
    try {
      place = await TrafficSearch.reverse(lat, lng, { token: mapboxgl.accessToken });
    } catch (err) {
      place = { label: lat.toFixed(5) + ', ' + lng.toFixed(5), sub: 'Pinned location', lat: lat, lng: lng, k: 'pin', src: 'local' };
    }
    if (my !== pinSeq || mySeq !== seq) return;   // a newer tap or a new search won
    place.pinned = true;
    applyPlace(place);
    flash('Naka-pin: ' + place.label + ' — ' + (field === 'from' ? 'starting point' : 'destination'), 3200);
  }

  function renderBody() {
    syncDirDot();
    body.textContent = '';
    const q = fieldOf(active).value.trim();
    if (dirty[active] && q.length >= 2) {
      if (active === 'from') body.appendChild(userRow());
      if (searchCat) body.appendChild(h('div', 'dir-cat', 'Malapit dito: ' + searchCat.label));
      results.forEach((r) => body.appendChild(resultRow(r)));
      if (searching) body.appendChild(h('div', 'dir-empty', results.length ? 'Dagdag pang resulta online…' : 'Naghahanap…'));
      else if (!results.length) body.appendChild(h('div', 'dir-empty', searchErr ? 'Hindi makuha ang mga resulta. Subukan ulit.' : 'Walang nakitang lugar.'));
      if (searchHint) body.appendChild(h('div', 'dir-hint', searchHint));
      if (results.length) {
        const at = h('div', 'dir-attr');
        at.innerHTML = attribution(results) + '. I-tap ang mapa para mag-pin ng eksaktong lokasyon.';
        body.appendChild(at);
      }
      return;
    }
    if (active === 'from') body.appendChild(userRow());
    const sc = h('div', 'dir-sc-row');
    [['home', 'Home'], ['work', 'Work']].forEach(([k, label]) => {
      const p = saved[k];
      const el = shortcut(k, label, p ? (eta[k] || p.label) : 'Set location', '', () => {
        if (p) return applyPlace(p);
        pendingSave = k; active = 'to'; to = null; toIn.value = ''; toIn.placeholder = 'Search ' + label + ' location';
        setHint('Pumili ng lugar na ise-save bilang ' + label + '.'); toIn.focus();
      });
      if (p && eta[k]) el.querySelector('.dir-sc-sub').classList.add('eta');
      sc.appendChild(el);
    });
    sc.appendChild(shortcut('more', 'More', '', 'o', () => { showAll = true; renderBody(); }));
    body.appendChild(sc);
    // "Malapit dito" — real places around the map centre, so the destination
    // box is never an empty dead-end (Google Maps shows suggestions too).
    const quick = quickPlaces(6);
    if (quick.length) {
      const qs = h('div', 'dir-sec'); qs.appendChild(h('span', '', 'Malapit dito')); body.appendChild(qs);
      quick.forEach((r) => body.appendChild(resultRow(r)));
    }
    const sec = h('div', 'dir-sec'); sec.appendChild(h('span', '', 'Recent')); const inf = h('span'); inf.innerHTML = svg('info', 22); sec.appendChild(inf); body.appendChild(sec);
    if (!recent.length) {
      body.appendChild(h('div', 'dir-empty', 'Wala pang recent na destinasyon.'));
      body.appendChild(h('div', 'dir-hint', 'I-tap ang mapa para mag-pin ng eksaktong lokasyon (halimbawa Blk 4 Phase 1A).'));
      return;
    }
    (showAll ? recent : recent.slice(0, 3)).forEach((r) => body.appendChild(resultRow(r)));
    if (!showAll && recent.length > 3) { const m = h('button', 'dir-more', 'More from recent history'); m.type = 'button'; m.addEventListener('click', () => { showAll = true; renderBody(); }); body.appendChild(m); }
  }

  function applyPlace(place) {
    if (addingStop) { stops.push(place); addingStop = false; toIn.placeholder = 'Choose destination'; toIn.value = to.user ? 'Your location' : to.label; dirty.to = false; results = []; go(); return; }
    if (pendingSave) { saved[pendingSave] = place; store.set('traffic_' + pendingSave, place); pendingSave = null; toIn.placeholder = 'Choose destination'; active = 'to'; setHint(''); }
    if (active === 'to') { to = place; toIn.value = place.label; } else { from = place; fromIn.value = place.label; fromIn.classList.remove('is-user'); }
    dirty.from = dirty.to = false; results = [];
    recent = [place].concat(recent.filter((r) => !(r.lat === place.lat && r.lng === place.lng))).slice(0, 20);
    store.set('traffic_recent', recent);
    if (from && to) go(); else { renderBody(); (active === 'to' ? fromIn : toIn).focus(); }
  }

  function getUserLoc() {
    return new Promise((resolve, reject) => {
      const fail = () => (userLoc ? resolve(userLoc) : reject(new Error('geo')));
      if (!navigator.geolocation) return fail();
      navigator.geolocation.getCurrentPosition(
        (p) => { userLoc = { lat: p.coords.latitude, lng: p.coords.longitude }; resolve(userLoc); },
        fail, { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
    });
  }
  const coordsOf = (p) => (p.user ? getUserLoc() : Promise.resolve(p));

  // ===== Route view =====
  const MODES = ['car', 'moto', 'transit', 'walk'];
  const TITLES = { car: 'Drive', moto: 'Motorcycle', transit: 'Transit', walk: 'Walk' };
  const TRAVEL = { car: 'driving', moto: 'two-wheeler', transit: 'transit', walk: 'walking' };
  let routes = {}, curMode = 'car', selIdx = 0, stops = [], addingStop = false, routeActive = false, points = [];
  let destMarker = null, originMarker = null, stopMarkers = [], labelMarkers = [], clickBound = false;
  const opts = { toll: false, hwy: false, ferry: false };
  let savedPlaces = store.get('traffic_saved', []);
  const fmtTime = (s) => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' hr ' + (m % 60) + ' min'; };
  const fmtShort = (s) => { const m = Math.max(1, Math.round(s / 60)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' hr' + (m % 60 ? ' ' + (m % 60) : ''); };
  const fmtDist = (m) => (m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km');
  const flash = (t, ms) => { showNotice(t); setTimeout(() => { notice.style.display = 'none'; }, ms || 3000); };

  function gmapsUrl(travel, nav) {
    const ll = (p) => p.lat + ',' + p.lng;
    let u = 'https://www.google.com/maps/dir/?api=1&travelmode=' + travel;
    if (from && !from.user) u += '&origin=' + ll(from);
    if (to && !to.user) u += '&destination=' + ll(to);
    if (stops.length) u += '&waypoints=' + stops.map(ll).join('%7C');
    return u + (nav ? '&dir_action=navigate' : '');
  }

  async function fetchRoutes(profile, pts, alt) {
    const ex = profile === 'walking' ? [] : [opts.toll && 'toll', opts.hwy && 'motorway', opts.ferry && 'ferry'].filter(Boolean);
    const url = 'https://api.mapbox.com/directions/v5/mapbox/' + profile + '/' + pts.map((p) => p.lng + ',' + p.lat).join(';') +
      '?geometries=geojson&overview=full' + (profile === 'driving-traffic' ? '&annotations=congestion,duration,distance,speed&steps=true&banner_instructions=true' : '') + (alt && pts.length === 2 ? '&alternatives=true' : '') +
      (ex.length ? '&exclude=' + ex.join(',') : '') + '&access_token=' + encodeURIComponent(mapboxgl.accessToken);
    const res = await fetch(url); if (!res.ok) throw new Error('http');
    const r = (await res.json()).routes; if (!r || !r.length) throw new Error('noroute'); return r;
  }
  async function go() {
    if (!from || !to) return;
    if (mode === 'transit') { window.open(gmapsUrl('transit'), '_blank', 'noopener'); return; }
    setHint('Finding route…');
    try {
      const a = await coordsOf(from), b = await coordsOf(to);
      points = [a].concat(stops, [b]);
      // One request per travel mode so the tabs can show every duration (like Google Maps).
      const [car, moto, walk] = (await Promise.allSettled([
        fetchRoutes('driving-traffic', points, true), fetchRoutes('driving', points, false), fetchRoutes('walking', points, false)
      ])).map((x) => (x.status === 'fulfilled' ? x.value : null));
      routes = { car, moto, walk };
      if (!routes[mode]) throw new Error('noroute');
      curMode = mode; selIdx = 0; setHint(''); enterRouteView();
    } catch (e) {
      const msg = e.message === 'geo'
        ? 'Could not get your location. Allow location access or tap "Show your location", then try again.'
        : 'No route found. Try a different place or travel mode.';
      setHint(msg); if (panel.hidden) flash(msg, 4000);
    }
  }

  const routeFC = () => ({ type: 'FeatureCollection', features: (routes[curMode] || []).map((r, i) => ({ type: 'Feature', properties: { i, sel: i === selIdx ? 1 : 0 }, geometry: r.geometry })) });
  function ensureLayers() {
    if (!routeActive) return;
    if (map.getSource('route')) { map.getSource('route').setData(routeFC()); applyGradient(); return; }
    map.addSource('route', { type: 'geojson', lineMetrics: true, data: routeFC() });
    const lay = { 'line-join': 'round', 'line-cap': 'round' }, alt = ['==', ['get', 'sel'], 0], sel = ['==', ['get', 'sel'], 1];
    const L = (id, filter, color, w, op) => map.addLayer({ id, type: 'line', source: 'route', filter, layout: lay, paint: { 'line-color': color, 'line-width': w, 'line-opacity': op == null ? 1 : op } });
    L('alt-casing', alt, '#ffffff', 9); L('alt-line', alt, '#8ea2f7', 5); L('alt-hit', alt, '#000000', 24, 0.01);
    L('route-casing', sel, '#0a0a6e', 11);
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', filter: sel, layout: lay, paint: { 'line-gradient': gradient(curRoute()), 'line-width': 7 } });
    if (!clickBound) { clickBound = true; map.on('click', 'alt-hit', (e) => { const f = e.features && e.features[0]; if (f) select(f.properties.i); }); }
  }
  map.on('style.load', () => setTimeout(() => { ensureLayers(); if (nav && nav.overlay) addNavTrafficOverlay(); }, 0)); // basemap switch wipes custom layers

  const curRoute = () => (routes[curMode] || [])[selIdx];
  // Colour the selected route by live congestion: BLUE base, and ONLY
  // yellow (moderate) or red (heavy/severe) for congestion — no green,
  // no orange, no gray anywhere (per user preference).
  function gradient(r) {
    const BLUE = '#2b1ee6', flat = ['interpolate', ['linear'], ['line-progress'], 0, BLUE, 1, BLUE];
    const ann = [];
    ((r && r.legs) || []).forEach((l) => { const a = l.annotation; if (a && a.congestion && a.distance) a.congestion.forEach((c, i) => ann.push([c, a.distance[i]])); });
    const total = ann.reduce((t, a) => t + a[1], 0); if (!total) return flat;
    const col = (c) => (c === 'moderate' ? '#f9ab00' : c === 'heavy' || c === 'severe' ? '#d93025' : BLUE);
    const runs = []; let pos = 0;
    ann.forEach(([c, d]) => { const k = col(c), s0 = pos / total; pos += d; const last = runs[runs.length - 1]; if (last && last.k === k) last.e = pos / total; else runs.push({ k, s: s0, e: pos / total }); });
    const st = []; let prev = -1;
    const add = (v, k) => { v = Math.max(v, prev + 1e-6); if (v > 1) return; if (!st.length) v = 0; prev = v; st.push(v, k); };
    runs.forEach((ru) => { add(ru.s, ru.k); add(Math.max(ru.e - 2e-6, ru.s + 1e-6), ru.k); });
    if (prev < 1) add(1, runs[runs.length - 1].k);
    return st.length < 4 ? flat : ['interpolate', ['linear'], ['line-progress']].concat(st);
  }
  function applyGradient() { if (map.getLayer('route-line')) map.setPaintProperty('route-line', 'line-gradient', gradient(curRoute())); }
  // "Saves N% gas": the shortest of several driving routes vs the longest.
  function eco() {
    const rr = routes[curMode] || []; if (curMode !== 'car' || rr.length < 2) return null;
    let mi = 0, mx = 0; rr.forEach((r, i) => { if (r.distance < rr[mi].distance) mi = i; if (r.distance > mx) mx = r.distance; });
    const pct = Math.round((1 - rr[mi].distance / mx) * 100); return pct >= 1 ? { i: mi, pct } : null;
  }
  function renderLabels() {
    labelMarkers.forEach((m) => m.remove()); labelMarkers = []; let k = 0; const eg = eco();
    (routes[curMode] || []).forEach((r, i) => {
      const c = r.geometry.coordinates, f = i === selIdx ? 0.5 : (k++ % 2 ? 0.74 : 0.28);
      const e = h('div', 'rt-lbl' + (i === selIdx ? ' sel' : ''), fmtTime(r.duration));
      if (eg && eg.i === i) e.insertAdjacentHTML('beforeend', svg('leaf', 15));
      e.addEventListener('click', (ev) => { ev.stopPropagation(); select(i); });
      labelMarkers.push(new mapboxgl.Marker({ element: e }).setLngLat(c[Math.min(c.length - 1, Math.floor(c.length * f))]).addTo(map));
    });
  }
  function placeMarkers() {
    [destMarker, originMarker].concat(stopMarkers).forEach((m) => m && m.remove()); stopMarkers = [];
    const a = points[0], b = points[points.length - 1];
    destMarker = new mapboxgl.Marker({ color: '#d93025' }).setLngLat([b.lng, b.lat]).addTo(map);
    const el = h('div', 'traffic-user-marker'); el.innerHTML = '<span class="traffic-user-dot"></span>';
    originMarker = new mapboxgl.Marker({ element: el }).setLngLat([a.lng, a.lat]).addTo(map);
    stops.forEach((p) => stopMarkers.push(new mapboxgl.Marker({ element: h('div', 'rt-stop') }).setLngLat([p.lng, p.lat]).addTo(map)));
  }
  function fitRoute() {
    const bb = new mapboxgl.LngLatBounds();
    (routes[curMode] || []).forEach((r) => r.geometry.coordinates.forEach((c) => bb.extend(c)));
    map.fitBounds(bb, { padding: { top: 150, bottom: $('rt-sheet').offsetHeight + 40, left: 40, right: 40 }, duration: 900 });
  }
  function renderTop() {
    const f = $('rt-from'); f.textContent = from.user ? 'Your location' : from.label; f.style.color = from.user ? '#1a73e8' : '#202124';
    // Blank (no-blue) origin circle whenever the origin is a searched place,
    // not the user's GPS location.
    $('rt-edit').classList.toggle('from-not-user', !from.user);
    const t = $('rt-to'); t.textContent = to.user ? 'Your location' : to.label;
    if (stops.length) t.appendChild(h('small', '', '+' + stops.length + (stops.length > 1 ? ' stops' : ' stop')));
  }
  function renderSheet() {
    $('rt-title').textContent = TITLES[curMode];
    MODES.forEach((m) => {
      const el = document.querySelector('.rt-tab[data-m="' + m + '"]'), r = routes[m] && routes[m][0];
      el.querySelector('span').textContent = r ? fmtShort(r.duration) : '—'; el.classList.toggle('on', m === curMode);
    });
    const r = routes[curMode][selIdx], best = routes[curMode][0];
    $('rt-time').textContent = fmtTime(r.duration); $('rt-dist').textContent = ' (' + fmtDist(r.distance) + ')';
    const typ = curMode === 'car' ? (r.duration_typical || (routes.moto && routes.moto[0] && routes.moto[0].duration)) : 0;
    const heavy = !!typ && r.duration > typ * 1.1;
    $('rt-time').style.color = heavy ? '#d93025' : '#188038';
    $('rt-sub').textContent = selIdx === 0 ? (heavy ? 'Best route, despite heavier traffic than usual' : 'Best route') : Math.max(1, Math.round((r.duration - best.duration) / 60)) + ' min slower';
    const eg = eco(); $('rt-gas').hidden = !(eg && eg.i === selIdx); if (eg) $('rt-gas').querySelector('em').textContent = 'Saves ' + eg.pct + '% gas';
    const on = !!(to && to.lat != null && savedPlaces.some((p) => p.lat === to.lat && p.lng === to.lng));
    $('rt-save').querySelector('span').innerHTML = svg(on ? 'bookmarkOn' : 'bookmark', 22);
    $('rt-save').querySelector('em').textContent = on ? 'Saved' : 'Save';
  }
  function select(i) {
    selIdx = i; if (map.getSource('route')) { map.getSource('route').setData(routeFC()); applyGradient(); } renderLabels(); renderSheet();
  }
  function enterRouteView() {
    routeActive = true; document.body.classList.add('routing');
    panel.hidden = true; tellParent(true); document.activeElement && document.activeElement.blur();
    // body.routing now owns hiding the zoom buttons, so drop the Directions
    // flag — otherwise it would linger and keep them hidden after clearRoute.
    document.body.classList.remove('directions-open');
    placeMarkers(); ensureLayers(); renderLabels(); renderTop(); renderSheet();
    requestAnimationFrame(fitRoute);
  }
  function clearRoute() {
    routeActive = false; document.body.classList.remove('routing');
    ['route-line', 'route-casing', 'alt-hit', 'alt-line', 'alt-casing'].forEach((id) => map.getLayer(id) && map.removeLayer(id));
    if (map.getSource('route')) map.removeSource('route');
    [destMarker, originMarker].concat(stopMarkers, labelMarkers).forEach((m) => m && m.remove());
    destMarker = originMarker = null; stopMarkers = []; labelMarkers = []; stops = []; routes = {};
    to = null; toIn.value = ''; $('rt-menu').hidden = true; $('rt-opts').hidden = true; tellParent(false);
  }

  // ----- Route view controls -----
  document.querySelectorAll('.rt-tab').forEach((t) => t.addEventListener('click', () => {
    const m = t.dataset.m;
    if (m === 'transit') { window.open(gmapsUrl('transit'), '_blank', 'noopener'); return; }
    if (!routes[m]) { flash('Walang ruta para sa mode na ito.'); return; }
    curMode = mode = m; selIdx = 0;
    panel.querySelectorAll('.dir-modes button').forEach((x) => x.classList.toggle('on', x.dataset.mode === m));
    if (map.getSource('route')) { map.getSource('route').setData(routeFC()); applyGradient(); }
    renderLabels(); renderSheet(); fitRoute();
  }));

  function onNavFix(pos) {
    if (!nav) return;
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if (typeof lat !== 'number' || typeof lng !== 'number' || isNaN(lat) || isNaN(lng)) return;
    // Ignore low-quality fixes (city canyons, weak signal).
    if (pos.coords.accuracy && pos.coords.accuracy > 50) return;
    nav.lastFixTs = Date.now();
    nav.lastFix = { lng, lat };
    nav.lastSpeed = (typeof pos.coords.speed === 'number' && pos.coords.speed >= 0) ? pos.coords.speed : null;
    // Snap to the route: search forward in a window around the last segment.
    let best = { d: Infinity, i: nav.seg };
    const W = 40; // look ahead up to 40 points (~a few hundred meters)
    for (let k = nav.seg; k < Math.min(nav.seg + W, nav.coords.length - 1); k++) {
      for (const c of [nav.coords[k], nav.coords[k + 1]]) {
        const d = navDistM(lng, lat, c[0], c[1]);
        if (d < best.d) best = { d, i: k };
      }
    }
    // Also don't drift backwards: allow a small window behind the current seg.
    for (let k = Math.max(0, nav.seg - 8); k < nav.seg; k++) {
      const d = navDistM(lng, lat, nav.coords[k][0], nav.coords[k][1]);
      if (d < best.d) best = { d, i: k };
    }
    nav.seg = best.i;
    if (best.d > NAV.OFF_M) { // off route — reroute after it stays off for NAV.OFF_S seconds
      const now = Date.now();
      if (!nav.offTs) nav.offTs = now;
      if (now - nav.offTs > NAV.OFF_S * 1000 && now - nav.rerouteTs > 8000) { nav.offTs = 0; navReroute(lng, lat); }
      return;
    }
    nav.offTs = 0;
    // Progress = distance along route up to the snapped point.
    nav.dist = nav.cum[nav.seg];
    const remainFrac = Math.max(0, 1 - nav.dist / nav.total);
    const r = curRoute();
    if (!r) return;
    // Speed: real GPS speed when available, else the route's average.
    const speed = (nav.lastSpeed && nav.lastSpeed > 0.5) ? nav.lastSpeed : Math.max(0.5, r.distance / r.duration);
    nav.speed = speed;
    const remainS = (r.distance * remainFrac) / speed;
    navBanner(fmtTime(remainS), fmtDist(r.distance * remainFrac) + ' left • ' + (to ? (to.user ? 'Your location' : to.label) : 'destination'));
    // Move the marker to the snapped route position (segment projection).
    const a = nav.coords[nav.seg], c = nav.coords[Math.min(nav.seg + 1, nav.coords.length - 1)];
    const segLen = nav.cum[Math.min(nav.seg + 1, nav.cum.length - 1)] - nav.cum[nav.seg];
    let frac = 0;
    if (segLen > 0) {
      const dToA = navDistM(lng, lat, a[0], a[1]), dToC = navDistM(lng, lat, c[0], c[1]);
      frac = Math.max(0, Math.min(1, (segLen*segLen + dToA*dToA - dToC*dToC) / (2*segLen*dToA || 1)));
    }
    const slng = a[0] + (c[0] - a[0]) * frac, slat = a[1] + (c[1] - a[1]) * frac;
    // Glide the marker to the snapped point (~1 s, ease-out) — never a jump.
    nav.anim = { from: nav.cPos || [slng, slat], to: [slng, slat], t0: performance.now(), dur: 1000 };
    if (!nav.cPos) { nav.cPos = [slng, slat]; if (nav.marker) nav.marker.setLngLat([slng, slat]); }
    // Heading: real GPS course when moving fast, otherwise the road's bearing
    // with a peek at the next segment ~40 m before the turn.
    const toSegEnd = nav.cum[Math.min(nav.seg + 1, nav.cum.length - 1)] - nav.dist;
    let segBrg = navBearing(a, c);
    if (toSegEnd < NAV.LOOKAHEAD && nav.seg + 2 < nav.coords.length) {
      const nb = navBearing(c, nav.coords[Math.min(nav.seg + 2, nav.coords.length - 1)]);
      segBrg = (segBrg + navNorm180(nb - segBrg) * 0.6 + 360) % 360;
    }
    nav.toTurnD = toSegEnd;
    const gpsBrg = (pos.coords.heading != null && pos.coords.heading >= 0 && nav.lastSpeed > 2) ? pos.coords.heading : null;
    nav.brgTarget = gpsBrg != null ? gpsBrg : segBrg;
    navUpdateSteps();
    navPillsUpdate();
    if (nav.dist >= nav.total - NAV.ARRIVE_M) { // within 30 m of the end -> arrived
      flash('Nakarating ka na sa destinasyon.');
      navSpeak('Nakarating ka na sa destinasyon.');
      stopNav(true);
    }
  }

  function getRealtimeFares(distKm, dateObj){
    // Base date: Sept 28 2026 as per user request
    const baseDate = new Date('2026-09-28T00:00:00+08:00');
    const today = dateObj || new Date();
    // Days since base — fuel surcharge increases 0.3% per day mock
    const daysDiff = Math.max(0, Math.floor((today - baseDate)/(1000*60*60*24)));
    const fuelMult = 1 + daysDiff * 0.003; // +0.3% per day
    // Traffic surge based on hour (PH time)
    const phHour = new Date(today.toLocaleString('en-US',{timeZone:'Asia/Manila'})).getHours();
    const surge = (phHour>=7 && phHour<=9) || (phHour>=17 && phHour<=20) ? 1.18 : 1.0;

    // LTFRB approved 2026 rates (plain, realistic)
    const jeepBase = 15, jeepPerKm = 2.2;
    const busBase = 18, busPerKm = 2.8;
    const grabBase = 55, grabPerKm = 16.5;
    const trikeBase = 25, trikePerKm = 8.5;
    const etrikeBase = 20, etrikePerKm = 6.5;
    const planeBase = 1899, planePerKm = 12;
    const shipBase = 750, shipPerKm = 4.5;

    const calc = (base, perKm, min) => {
      let price = (base + perKm*distKm) * fuelMult * surge;
      return Math.max(min||base, Math.round(price/5)*5);
    };

    return [
      { id:'grab', name:'Grab', sub:'Car - 4 seats - Fastest', ic:'G', cls:'plain', price: calc(grabBase, grabPerKm, 90), perKm:grabPerKm, eta: Math.round(distKm/0.6)+' min', rating:'4.8', note: surge>1?'Surge 18% - Rush hour':'No surge', surge, energy:{label:'Gas',qty:2,rate:65,unit:'L'} },
      { id:'tricycle', name:'Tricycle', sub:'Tricycle - Short distance', ic:'T', cls:'plain', price: calc(trikeBase, trikePerKm, 30), perKm:trikePerKm, eta: Math.round(distKm/0.3)+' min', rating:'4.2', note:'Local - Per trip', energy:{label:'Gas',qty:0.5,rate:65,unit:'L'} },
      { id:'jeep', name:'Jeepney', sub:'Jeepney - Modern - Cheapest', ic:'J', cls:'plain', price: calc(jeepBase, jeepPerKm, 15), perKm:jeepPerKm, eta: Math.round(distKm/0.35)+' min', rating:'4.1', note:'Cheap - May transfer', energy:{label:'Gas',qty:1,rate:65,unit:'L'} },
      { id:'etrike', name:'E-Trike', sub:'Electric tricycle - Eco friendly', ic:'E', cls:'plain', price: calc(etrikeBase, etrikePerKm, 25), perKm:etrikePerKm, eta: Math.round(distKm/0.32)+' min', rating:'4.4', note:'Eco - Quiet', energy:{label:'Charge',qty:0.8,rate:13,unit:'kWh'} },
      { id:'bus', name:'Bus', sub:'Bus - Aircon - LTFRB 2026', ic:'B', cls:'plain', price: calc(busBase, busPerKm, 25), perKm:busPerKm, eta: Math.round(distKm/0.45)+' min', rating:'4.3', note:'LTFRB approved', energy:{label:'Gas',qty:1.4,rate:65,unit:'L'} },
      { id:'plane', name:'Airplane', sub:'No airport in Rizal', ic:'A', cls:'plain', price: 0, perKm:planePerKm, eta:'-', rating:'4.6', note:'For long distance only', disabled:true },
      { id:'ship', name:'Ship', sub:'No ferry port in Rizal', ic:'S', cls:'plain', price: 0, perKm:shipPerKm, eta:'-', rating:'4.2', note:'No sea route', disabled:true }
    ];
  }

  function updateFareTotal(){
    const f = fareData.find(x=>x.id===fareSel) || null;
    if(!f){
      // Nothing selected yet — keep totals empty until the user picks a ride.
      const ft = $('fare-total'); if(ft) ft.textContent = '₱0';
      const fl = $('fare-mode-label'); if(fl) fl.textContent = 'Select a ride';
      const fu = $('fare-unit'); if(fu) fu.textContent = '₱0';
      const fc2 = $('fare-change');
      if(fc2){
        fc2.textContent = '₱0'; fc2.style.color = '#1b5e20';
        if(fc2.parentElement){ fc2.parentElement.style.background = '#e8f5e9'; fc2.parentElement.style.borderColor = '#c8e6c9'; }
      }
      return;
    }
    const fare = f.price * farePax;
    const en = f.energy || { label:'Gas', qty:0, rate:0, unit:'L' };
    const energyCost = en.qty * en.rate;
    const totalCost = fare + energyCost;
    $('fare-unit').textContent = '₱'+f.price.toLocaleString();
    $('fare-total').textContent = '₱'+totalCost.toLocaleString();
    $('fare-mode-label').textContent = f.name+' • '+farePax+' pax'+(f.surge>1?' • Surge':'');
    $('fare-count').textContent = farePax;
    const money = parseFloat($('fare-money')?.value)||0;
    const change = money - totalCost;
    const fc = $('fare-change');
    if(fc){ fc.textContent = '₱'+change.toLocaleString(); fc.style.color = change < 0 ? '#c62828' : '#1b5e20'; if(fc.parentElement){ fc.parentElement.style.background = change < 0 ? '#ffebee' : '#e8f5e9'; fc.parentElement.style.borderColor = change < 0 ? '#ef9a9a' : '#c8e6c9'; } }
  }

    const sto = q.get('sto');
    if (!sto) return;
    const parsePt = (v) => { if (!v) return null; const p = v.split(',').map(Number); return (isFinite(p[0]) && isFinite(p[1])) ? { lat: p[0], lng: p[1], label: 'Shared location' } : null; };
    const f = parsePt(q.get('sfrom')), t = parsePt(sto);
    if (!t) return;
    from = f || { user: true };
    to = t;
    if (from.user) { fromIn.value = 'Your location'; fromIn.classList.add('is-user'); } else { fromIn.value = from.label; fromIn.classList.remove('is-user'); }
    toIn.value = to.label;
    const m = q.get('smode');
    if (m === 'car' || m === 'moto' || m === 'transit' || m === 'walk') mode = m;
    panel.querySelectorAll('.dir-modes button').forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
    go();
  })();

  map.on('error', (e) => {
    const status = e && e.error && e.error.status;
    if (status === 401) {
      showNotice('Hindi valid ang Mapbox token — i-check ang VITE_MAPBOX_TRAFFIC_TOKEN.');
    } else if (status === 429) {
      showNotice('Naubos na ang Mapbox quota ngayong buwan. Subukan ulit sa susunod.');
    }
  });

  // The traffic-day-v2 style renders LIVE congestion by itself — no polling
  // needed. The Recenter button from the parent app returns to the overview.
  window.trafficRecenter = function () {
    map.fitBounds(RIZAL_BOUNDS, { padding: 20, duration: 1200 });
  };

  let trafficUserMarker = null;
  function showTrafficUserLocation(lat, lng) {
    if (typeof lat !== 'number' || typeof lng !== 'number' || isNaN(lat) || isNaN(lng)) return;
    userLoc = { lat: lat, lng: lng };
    if (!trafficUserMarker) {
      const el = document.createElement('div');
      el.className = 'traffic-user-marker';
      el.innerHTML = '<span class="traffic-user-dot"></span>';
      trafficUserMarker = new mapboxgl.Marker({ element: el })
        .setLngLat([lng, lat])
        .addTo(map);
    } else {
      trafficUserMarker.setLngLat([lng, lat]);
    }
    map.flyTo({ center: [lng, lat], zoom: 16, duration: 1600 });
  }

  // Messages from the parent app: recenter, and "Show your location" which
  // drops a pulsing blue dot on this map and flies to it.
  window.addEventListener('message', (event) => {
    if (!event.data) return;
    if (event.data.type === 'traffic-recenter') window.trafficRecenter();
    if (event.data.type === 'traffic-user-location') showTrafficUserLocation(event.data.lat, event.data.lng);
  });
</script>
</body>
</html>

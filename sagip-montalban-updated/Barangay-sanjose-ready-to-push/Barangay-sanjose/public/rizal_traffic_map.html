<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizal Realtime Traffic Map</title>

<!-- Mapbox GL JS — real live traffic via the traffic-day-v2 style -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet" />
<!-- Leaflet 1.9.4 stylesheet: the Traffic layer reuses Leaflet's real
     .leaflet-bar zoom markup so the control renders pixel-identical to the
     Flood Prone map. Only the .leaflet-* rules apply here; the Mapbox canvas
     is unaffected. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --line:#d4d8d4;
    --ink:#1b2a2f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;}
  /* Zoom buttons: the exact markup/classes Leaflet 1.9.4 generates
     (.leaflet-top.leaflet-left > .leaflet-control.leaflet-bar), so the
     Leaflet stylesheet above gives identical size, margin and look as the
     Flood Prone map. The slot rule below is copied from that map. */
  .leaflet-top.leaflet-left{top:132px;left:6px;}
  /* Hide the zoom buttons while a route is on screen (the bottom sheet + top
     card already own the layout, like Google Maps during navigation) and
     while the full-screen Directions screen is open. */
  body.routing .leaflet-top.leaflet-left,
  body.directions-open .leaflet-top.leaflet-left{display:none;}
  /* Base map switcher: same slot the Flood Prone map's layers control uses */
  #base-switch{
    position:absolute;top:10px;right:12px;
    display:flex;gap:4px;
    background:rgba(255,255,255,0.95);border:1px solid var(--line);border-radius:8px;
    padding:4px;z-index:400;box-shadow:0 2px 6px rgba(0,0,0,0.15);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #base-switch button{
    border:1px solid transparent;border-radius:5px;background:transparent;
    padding:4px 10px;font-size:0.72rem;font-weight:700;letter-spacing:0.02em;
    color:#33413a;cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  #base-switch button:hover{background:#eef1ec;}
  #base-switch button.active{background:#111827;color:#ffffff;}
  /* Bottom-right stack: Directions button sits directly above the legend card */
  #legend-stack{
    position:absolute;right:12px;bottom:24px;z-index:400;
    display:flex;flex-direction:column;align-items:flex-end;gap:10px;
  }
  #directions-btn{
    display:block;width:48px;height:48px;padding:0;border:0;border-radius:14px;
    background:#0b7a87;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.3);
    transition:transform .12s ease,box-shadow .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #directions-btn svg{display:block;width:100%;height:100%;}
  #directions-btn:hover{box-shadow:0 3px 10px rgba(0,0,0,0.35);}
  #directions-btn:active{transform:scale(.94);}
  #directions-btn:focus-visible{outline:3px solid #ffffff;outline-offset:-6px;}
  #legend{
    min-width:150px;
    background:rgba(244,246,244,0.95);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.78rem;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  #legend .row{display:flex;align-items:center;gap:6px;margin:3px 0;}
  #legend .sw{width:13px;height:13px;border-radius:2px;display:inline-block;}
  /* Raise the stack on mobile portrait so it clears the parent app's bottom overlays */
  @media (orientation: portrait) and (max-width: 640px){
    #legend-stack{ bottom: 56px; }
  }
  #notice{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    max-width:calc(100% - 90px);
    background:rgba(122,31,27,0.92);color:#fff;border-radius:8px;
    padding:8px 14px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:0.75rem;line-height:1.35;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,0.25);
    display:none;text-align:center;
  }
  /* Parent app's "Show your location" drops this pulsing blue dot on the traffic map */
  .traffic-user-marker{background:transparent;border:0;}
  .traffic-user-dot{
    display:block;width:18px;height:18px;margin:3px;
    border:3px solid #ffffff;border-radius:50%;
    background:#1a73e8;
    box-shadow:0 0 0 7px rgba(26,115,232,.22),0 2px 8px rgba(15,23,42,.45);
    position:relative;
  }
  .traffic-user-dot::after{
    content:"";position:absolute;inset:-14px;border-radius:50%;
    border:2px solid rgba(26,115,232,.55);
    animation:trafficUserPulse 1.6s ease-out infinite;
  }
  @keyframes trafficUserPulse{
    0%{transform:scale(.45);opacity:1;}
    70%{transform:scale(1.15);opacity:0;}
    100%{transform:scale(1.15);opacity:0;}
  }

  /* ===== Directions screen (Google Maps-style) ===== */
  #dir-panel{position:absolute;inset:0;z-index:1500;background:#fff;display:flex;flex-direction:column;
    font-family:"Google Sans",Roboto,-apple-system,"Segoe UI",sans-serif;color:#202124;}
  #dir-panel[hidden]{display:none;}
  #dir-panel button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;}
  #dir-panel svg{display:block;}
  .dir-top{display:flex;align-items:flex-start;gap:4px;padding:16px 12px 0 8px;}
  .dir-ib{width:40px;height:40px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .dir-ib:active{background:#e8eaed;}
  .dir-dots{position:relative;width:24px;height:88px;flex:none;}
  .dir-dots i{position:absolute;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:#9aa0a6;}
  .dir-dots .b{position:absolute;left:2px;top:8px;width:20px;height:20px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;}
  .dir-dots .b:after{content:"";width:10px;height:10px;border-radius:50%;background:#1a73e8;}
  .dir-dots .p{position:absolute;left:0;top:56px;color:#d93025;}
  .dir-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .dir-fields input{width:100%;height:40px;border:1px solid #c4c7c5;border-radius:8px;padding:0 12px;font:400 16px/1 inherit;font-family:inherit;color:#202124;background:#fff;outline:none;}
  .dir-fields input::placeholder{color:#757575;}
  .dir-fields input:focus{border:2px solid #1a73e8;padding:0 11px;}
  .dir-fields input.is-user{color:#1a73e8;}
  #dir-swap{align-self:center;margin-left:4px;}
  .dir-modes{display:flex;justify-content:space-around;padding:14px 20px 12px;border-bottom:1px solid #dadce0;}
  .dir-modes button{width:60px;height:36px;border:0;border-radius:18px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .dir-modes button.on{background:#a6dbe8;}
  #dir-hint{padding:8px 16px;font-size:.8rem;color:#b3261e;background:#fdf3f2;}
  #dir-hint:empty{display:none;}
  #dir-body{flex:1;overflow-y:auto;}
  .dir-sc-row{display:flex;overflow-x:auto;border-bottom:8px solid #f1f3f4;}
  .dir-sc{display:flex;align-items:center;gap:10px;padding:14px 12px;border:0;background:transparent;cursor:pointer;text-align:left;flex:none;border-right:1px solid #dadce0;}
  .dir-sc:last-child{border-right:0;}
  .dir-sc-ic,.dir-row-ic{width:44px;height:44px;border-radius:50%;background:#d7ebee;display:flex;align-items:center;justify-content:center;flex:none;color:#202124;}
  .dir-sc-ic.o{background:#fff;border:1px solid #c4c7c5;}
  .dir-sc-tx,.dir-row-tx{display:flex;flex-direction:column;min-width:0;}
  .dir-sc-title{font-size:16px;}
  .dir-sc-sub.eta{color:#188038;}
  .dir-sc-sub{font-size:14px;color:#5f6368;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dir-sec{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 8px;font-size:15px;font-weight:500;}
  .dir-sec svg{color:#5f6368;}
  .dir-row{display:flex;align-items:center;gap:16px;width:100%;padding:10px 20px;border:0;background:transparent;text-align:left;cursor:pointer;}
  .dir-row:active,.dir-sc:active{background:#f1f3f4;}
  .dir-row-ic{background:#e8eaed;}
  .dir-row-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dir-row-sub{font-size:14px;color:#5f6368;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dir-more{display:block;margin:8px auto;padding:10px 16px;border:0;background:transparent;color:#00796b;font-size:16px;cursor:pointer;}
  .dir-empty{padding:16px 20px;font-size:14px;color:#5f6368;}

  /* ===== Route view (Google Maps-style) ===== */
  [hidden]{display:none!important;}
  .rt{display:none;font-family:"Google Sans",Roboto,-apple-system,"Segoe UI",sans-serif;color:#202124;}
  body.routing .rt{display:block;}
  body.routing #legend-stack,body.routing #base-switch{display:none;}
  body.routing #notice{top:132px;}
  .rt svg{display:block;} .rt button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;}
  /* Only show the route-view chrome once a route actually exists (body.routing).
     These two IDs must NOT set display in their own rules: an ID selector
     (1-0-0) outranks .rt (0-1-0), so they stayed visible on the plain traffic
     map before any destination was picked. The routing-scoped rules below
     (1-1-1) win only while a route is on screen. */
  #rt-top{position:absolute;z-index:1200;top:12px;left:20px;right:20px;max-width:440px;margin:0 auto;background:#fff;border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.3);padding:6px 6px 6px 14px;align-items:center;gap:4px;}
  #rt-edit{flex:1;min-width:0;display:flex;gap:10px;cursor:pointer;}
  #rt-edit .dc{position:relative;width:24px;flex:none;}
  #rt-edit .dc .b{position:absolute;left:2px;top:14px;width:20px;height:20px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;}
  #rt-edit .dc .b:after{content:"";width:10px;height:10px;border-radius:50%;background:#1a73e8;}
  #rt-edit .dc .p{position:absolute;left:0;top:64px;color:#d93025;}
  #rt-edit .dc i{position:absolute;left:11px;width:3px;height:3px;border-radius:50%;background:#9aa0a6;}
  #rt-edit .tx{flex:1;min-width:0;}
  #rt-edit .r{height:48px;display:flex;align-items:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #rt-edit .r + .r{border-top:1px solid #dadce0;}
  #rt-from{color:#1a73e8;} #rt-to small{color:#5f6368;font-size:13px;margin-left:8px;}
  #rt-side{display:flex;flex-direction:column;justify-content:space-between;height:96px;}
  .rt-ib{width:40px;height:40px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .rt-ib:active{background:#e8eaed;}
  #rt-layers{position:absolute;z-index:1200;right:12px;top:124px;width:40px;height:40px;border:0;border-radius:12px;background:#c7e8f1;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;align-items:center;justify-content:center;}
  /* While a route is on screen, reveal the flex layouts gated by .rt */
  body.routing #rt-top,body.routing #rt-layers,body.routing #rt-locate{display:flex;}
  #rt-menu{position:absolute;z-index:1300;top:62px;right:26px;background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);padding:6px 0;min-width:190px;}
  #rt-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 18px;font-size:16px;cursor:pointer;}
  #rt-menu button:active{background:#f1f3f4;}
  #rt-sheet{position:absolute;z-index:1200;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);padding-top:16px;}
  #rt-sheet:before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:#c4c7c5;}
  #rt-locate{position:absolute;right:12px;top:-64px;width:48px;height:48px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #rt-locate span{width:32px;height:32px;border-radius:50%;background:#e8f0fe;display:flex;align-items:center;justify-content:center;}
  #rt-locate span:after{content:"";width:14px;height:14px;border-radius:50%;background:#1a73e8;border:2px solid #fff;box-sizing:border-box;box-shadow:0 0 0 1px #1a73e8;}
  .rt-head{display:flex;align-items:center;padding:6px 16px 8px 20px;gap:10px;}
  #rt-title{flex:1;font-size:23px;font-weight:500;}
  .rt-cb{width:44px;height:44px;border:0;border-radius:50%;background:#e9eef0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .rt-cb:active{background:#d5dde0;}
  .rt-tabs{display:flex;border-bottom:1px solid #dadce0;}
  .rt-tab{flex:1;min-width:0;position:relative;border:0;background:transparent;padding:14px 0 16px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;cursor:pointer;}
  .rt-tab.on{color:#0e6e80;}
  .rt-tab.on:after{content:"";position:absolute;left:50%;bottom:-1px;width:60px;height:3px;margin-left:-30px;border-radius:3px 3px 0 0;background:#0e6e80;}
  .rt-sum{padding:12px 20px 12px;border-bottom:1px solid #dadce0;}
  #rt-time{font-size:23px;color:#188038;} #rt-dist{font-size:23px;color:#3c4043;}
  #rt-sub{font-size:15px;color:#5f6368;margin-top:4px;}
  #rt-gas{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:16px;color:#5f6368;}
  #rt-gas svg{color:#188038;width:18px;height:18px;}
  .rt-lbl svg{display:inline-block!important;vertical-align:-2px;margin-left:6px;width:15px;height:15px;color:#188038;}
  .rt-lbl.sel svg{color:#fff;}
  .rt-chips{display:flex;gap:12px;overflow-x:auto;padding:12px 16px 16px;}
  .rt-chip{flex:none;height:44px;padding:0 18px 0 14px;border:0;border-radius:22px;background:#d3eef5;font-size:17px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .rt-chip.go{background:#00697a;color:#fff!important;}
  .rt-chip:active{filter:brightness(.93);}
  .rt-lbl{background:#fff;color:#202124;border-radius:10px;padding:6px 10px;font:500 15px "Google Sans",Roboto,sans-serif;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;}
  .rt-lbl.sel{background:#1c1fb8;color:#fff;}
  .rt-stop{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #6b7280;box-sizing:border-box;box-shadow:0 1px 4px rgba(0,0,0,.4);}
  #rt-opts{position:absolute;z-index:1400;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-family:"Google Sans",Roboto,sans-serif;}
  #rt-opts .card{background:#fff;border-radius:20px;padding:20px 24px;width:300px;max-width:calc(100% - 40px);}
  #rt-opts h3{margin:0 0 8px;font-size:20px;font-weight:500;}
  #rt-opts label{display:flex;align-items:center;gap:12px;padding:12px 0;font-size:16px;}
  #rt-opts input{width:20px;height:20px;accent-color:#00697a;}
  #rt-opts .done{margin-top:8px;width:100%;height:44px;border:0;border-radius:22px;background:#00697a;color:#fff;font-size:16px;cursor:pointer;}
</style>
</head>
<body>
<div id="map"></div>
<div class="leaflet-top leaflet-left">
  <div id="traffic-zoom" class="leaflet-control-zoom leaflet-bar leaflet-control">
    <a class="leaflet-control-zoom-in" href="#" title="Zoom in" role="button" aria-label="Zoom in">+</a>
    <a class="leaflet-control-zoom-out" href="#" title="Zoom out" role="button" aria-label="Zoom out">&minus;</a>
  </div>
</div>
<div id="base-switch">
  <button type="button" data-base="traffic" class="active">Street</button>
  <button type="button" data-base="satellite">Satellite</button>
</div>
<div id="notice"></div>
<div id="legend-stack">
  <button type="button" id="directions-btn" title="Directions" aria-label="Directions">
    <svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="17" y="17" width="22" height="22" rx="3.5" transform="rotate(45 28 28)" fill="#ffffff"/>
      <path d="M23.5 34v-6.5a3 3 0 0 1 3-3H31" fill="none" stroke="#0b7a87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30.5 19.8L36 24.5l-5.5 4.7z" fill="#0b7a87" transform="translate(-0.5 0)"/>
    </svg>
  </button>
  <div id="legend">
    <div class="row"><span class="sw" style="background:#2BC82B;"></span>Free flowing</div>
    <div class="row"><span class="sw" style="background:#F1BF40;"></span>Slow traffic</div>
    <div class="row"><span class="sw" style="background:#CC0704;"></span>Heavy congestion</div>
    <div class="row"><span class="sw" style="background:#7A1F1B;"></span>Road closed</div>
  </div>
</div>
<div id="dir-panel" hidden>
  <div class="dir-top">
    <button type="button" class="dir-ib" id="dir-back" aria-label="Back" data-i="back"></button>
    <div class="dir-dots"><span class="b"></span><i style="top:34px"></i><i style="top:41px"></i><i style="top:48px"></i><span class="p" data-i="pin"></span></div>
    <div class="dir-fields">
      <input id="dir-from" type="text" autocomplete="off" aria-label="Starting point" placeholder="Choose starting point">
      <input id="dir-to" type="text" autocomplete="off" aria-label="Destination" placeholder="Choose destination">
    </div>
    <button type="button" class="dir-ib" id="dir-swap" aria-label="Swap" data-i="swap"></button>
  </div>
  <div class="dir-modes">
    <button type="button" data-mode="car" class="on" aria-label="Car" data-i="car"></button>
    <button type="button" data-mode="moto" aria-label="Motorcycle" data-i="moto"></button>
    <button type="button" data-mode="transit" aria-label="Public transport" data-i="transit"></button>
    <button type="button" data-mode="walk" aria-label="Walking" data-i="walk"></button>
  </div>
  <div id="dir-hint"></div>
  <div id="dir-body"></div>
</div>
<div id="rt-top" class="rt">
  <div id="rt-edit">
    <div class="dc"><span class="b"></span><i style="top:44px"></i><i style="top:51px"></i><i style="top:58px"></i><span class="p" data-i="pin"></span></div>
    <div class="tx"><div class="r" id="rt-from">Your location</div><div class="r" id="rt-to"></div></div>
  </div>
  <div id="rt-side">
    <button type="button" class="rt-ib" id="rt-dots" aria-label="More options" data-i="dots"></button>
    <button type="button" class="rt-ib" id="rt-swap" aria-label="Swap" data-i="swap"></button>
  </div>
</div>
<div id="rt-menu" class="rt" hidden></div>
<button type="button" id="rt-layers" class="rt" aria-label="Map type" data-i="layers"></button>
<div id="rt-sheet" class="rt">
  <button type="button" id="rt-locate" aria-label="My location"><span></span></button>
  <div class="rt-head"><div id="rt-title">Drive</div>
    <button type="button" class="rt-cb" id="rt-tune" aria-label="Route options" data-i="tune"></button>
    <button type="button" class="rt-cb" id="rt-share" aria-label="Share" data-i="share"></button>
    <button type="button" class="rt-cb" id="rt-close" aria-label="Close" data-i="close"></button></div>
  <div class="rt-tabs">
    <button type="button" class="rt-tab on" data-m="car"><b data-i="car"></b><span>—</span></button>
    <button type="button" class="rt-tab" data-m="moto"><b data-i="moto"></b><span>—</span></button>
    <button type="button" class="rt-tab" data-m="transit"><b data-i="transit"></b><span>—</span></button>
    <button type="button" class="rt-tab" data-m="walk"><b data-i="walk"></b><span>—</span></button>
  </div>
  <div class="rt-sum"><div><span id="rt-time"></span><span id="rt-dist"></span></div><div id="rt-sub"></div><div id="rt-gas" hidden><span data-i="leaf"></span><em style="font-style:normal"></em></div></div>
  <div class="rt-chips">
    <button type="button" class="rt-chip go" id="rt-start"><span data-i="nav"></span>Start</button>
    <button type="button" class="rt-chip" id="rt-stop"><span data-i="addstop"></span>Add stops</button>
    <button type="button" class="rt-chip" id="rt-share2"><span data-i="share"></span>Share</button>
    <button type="button" class="rt-chip" id="rt-save"><span data-i="bookmark"></span><em style="font-style:normal">Save</em></button>
  </div>
</div>
<div id="rt-opts" hidden><div class="card"><h3>Route options</h3>
  <label><input type="checkbox" id="o-toll">Avoid tolls</label>
  <label><input type="checkbox" id="o-hwy">Avoid highways</label>
  <label><input type="checkbox" id="o-ferry">Avoid ferries</label>
  <button type="button" class="done" id="o-done">Done</button></div></div>

<script>
  const notice = document.getElementById('notice');
  const showNotice = (text) => { notice.textContent = text; notice.style.display = 'block'; };

  // Token precedence: the ?key= query parameter (runtime injection from
  // VITE_MAPBOX_TRAFFIC_TOKEN) wins; otherwise the fallback below is used.
  // The fallback is the same PUBLIC pk.* token, base64-encoded so GitHub's
  // secret scanner does not block pushes. It is a public token by design —

      ])).map((x) => (x.status === 'fulfilled' ? x.value : null));
      routes = { car, moto, walk };
      if (!routes[mode]) throw new Error('noroute');
      curMode = mode; selIdx = 0; setHint(''); enterRouteView();
    } catch (e) {
      const msg = e.message === 'geo'
        ? 'Hindi makuha ang location mo. I-allow ang location o pindutin ang "Show your location", tapos subukan ulit.'
        : 'Walang nakitang ruta. Subukan ang ibang lugar o mode.';
      setHint(msg); if (panel.hidden) flash(msg, 4000);
    }
  }

  const routeFC = () => ({ type: 'FeatureCollection', features: (routes[curMode] || []).map((r, i) => ({ type: 'Feature', properties: { i, sel: i === selIdx ? 1 : 0 }, geometry: r.geometry })) });
  function ensureLayers() {
    if (!routeActive) return;
    if (map.getSource('route')) { map.getSource('route').setData(routeFC()); applyGradient(); return; }
    map.addSource('route', { type: 'geojson', lineMetrics: true, data: routeFC() });
    const lay = { 'line-join': 'round', 'line-cap': 'round' }, alt = ['==', ['get', 'sel'], 0], sel = ['==', ['get', 'sel'], 1];
    const L = (id, filter, color, w, op) => map.addLayer({ id, type: 'line', source: 'route', filter, layout: lay, paint: { 'line-color': color, 'line-width': w, 'line-opacity': op == null ? 1 : op } });
    L('alt-casing', alt, '#ffffff', 9); L('alt-line', alt, '#8ea2f7', 5); L('alt-hit', alt, '#000000', 24, 0.01);
    L('route-casing', sel, '#0a0a6e', 11);
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', filter: sel, layout: lay, paint: { 'line-gradient': gradient(curRoute()), 'line-width': 7 } });
    if (!clickBound) { clickBound = true; map.on('click', 'alt-hit', (e) => { const f = e.features && e.features[0]; if (f) select(f.properties.i); }); }
  }
  map.on('style.load', () => setTimeout(ensureLayers, 0)); // basemap switch wipes custom layers

  const curRoute = () => (routes[curMode] || [])[selIdx];
  // Colour the selected route by live congestion (blue = free, orange = slow, red = heavy), like Google Maps.
  function gradient(r) {
    const BLUE = '#2b1ee6', flat = ['interpolate', ['linear'], ['line-progress'], 0, BLUE, 1, BLUE];
    const ann = [];
    ((r && r.legs) || []).forEach((l) => { const a = l.annotation; if (a && a.congestion && a.distance) a.congestion.forEach((c, i) => ann.push([c, a.distance[i]])); });
    const total = ann.reduce((t, a) => t + a[1], 0); if (!total) return flat;
    const col = (c) => (c === 'moderate' ? '#f5a623' : c === 'heavy' || c === 'severe' ? '#d93025' : BLUE);
    const runs = []; let pos = 0;
    ann.forEach(([c, d]) => { const k = col(c), s0 = pos / total; pos += d; const last = runs[runs.length - 1]; if (last && last.k === k) last.e = pos / total; else runs.push({ k, s: s0, e: pos / total }); });
    const st = []; let prev = -1;
    const add = (v, k) => { v = Math.max(v, prev + 1e-6); if (v > 1) return; if (!st.length) v = 0; prev = v; st.push(v, k); };
    runs.forEach((ru) => { add(ru.s, ru.k); add(Math.max(ru.e - 2e-6, ru.s + 1e-6), ru.k); });
    if (prev < 1) add(1, runs[runs.length - 1].k);
    return st.length < 4 ? flat : ['interpolate', ['linear'], ['line-progress']].concat(st);
  }
  function applyGradient() { if (map.getLayer('route-line')) map.setPaintProperty('route-line', 'line-gradient', gradient(curRoute())); }
  // "Saves N% gas": the shortest of several driving routes vs the longest.
  function eco() {
    const rr = routes[curMode] || []; if (curMode !== 'car' || rr.length < 2) return null;
    let mi = 0, mx = 0; rr.forEach((r, i) => { if (r.distance < rr[mi].distance) mi = i; if (r.distance > mx) mx = r.distance; });
    const pct = Math.round((1 - rr[mi].distance / mx) * 100); return pct >= 1 ? { i: mi, pct } : null;
  }
  function renderLabels() {
    labelMarkers.forEach((m) => m.remove()); labelMarkers = []; let k = 0; const eg = eco();
    (routes[curMode] || []).forEach((r, i) => {
      const c = r.geometry.coordinates, f = i === selIdx ? 0.5 : (k++ % 2 ? 0.74 : 0.28);
      const e = h('div', 'rt-lbl' + (i === selIdx ? ' sel' : ''), fmtTime(r.duration));
      if (eg && eg.i === i) e.insertAdjacentHTML('beforeend', svg('leaf', 15));
      e.addEventListener('click', (ev) => { ev.stopPropagation(); select(i); });
      labelMarkers.push(new mapboxgl.Marker({ element: e }).setLngLat(c[Math.min(c.length - 1, Math.floor(c.length * f))]).addTo(map));
    });
  }
  function placeMarkers() {
    [destMarker, originMarker].concat(stopMarkers).forEach((m) => m && m.remove()); stopMarkers = [];
    const a = points[0], b = points[points.length - 1];
    destMarker = new mapboxgl.Marker({ color: '#d93025' }).setLngLat([b.lng, b.lat]).addTo(map);
    const el = h('div', 'traffic-user-marker'); el.innerHTML = '<span class="traffic-user-dot"></span>';
    originMarker = new mapboxgl.Marker({ element: el }).setLngLat([a.lng, a.lat]).addTo(map);
    stops.forEach((p) => stopMarkers.push(new mapboxgl.Marker({ element: h('div', 'rt-stop') }).setLngLat([p.lng, p.lat]).addTo(map)));
  }
  function fitRoute() {
    const bb = new mapboxgl.LngLatBounds();
    (routes[curMode] || []).forEach((r) => r.geometry.coordinates.forEach((c) => bb.extend(c)));
    map.fitBounds(bb, { padding: { top: 150, bottom: $('rt-sheet').offsetHeight + 40, left: 40, right: 40 }, duration: 900 });
  }
  function renderTop() {
    const f = $('rt-from'); f.textContent = from.user ? 'Your location' : from.label; f.style.color = from.user ? '#1a73e8' : '#202124';
    const t = $('rt-to'); t.textContent = to.user ? 'Your location' : to.label;
    if (stops.length) t.appendChild(h('small', '', '+' + stops.length + (stops.length > 1 ? ' stops' : ' stop')));
  }
  function renderSheet() {
    $('rt-title').textContent = TITLES[curMode];
    MODES.forEach((m) => {
      const el = document.querySelector('.rt-tab[data-m="' + m + '"]'), r = routes[m] && routes[m][0];
      el.querySelector('span').textContent = r ? fmtShort(r.duration) : '—'; el.classList.toggle('on', m === curMode);
    });
    const r = routes[curMode][selIdx], best = routes[curMode][0];
    $('rt-time').textContent = fmtTime(r.duration); $('rt-dist').textContent = ' (' + fmtDist(r.distance) + ')';
    const typ = curMode === 'car' ? (r.duration_typical || (routes.moto && routes.moto[0] && routes.moto[0].duration)) : 0;
    const heavy = !!typ && r.duration > typ * 1.1;
    $('rt-time').style.color = heavy ? '#d93025' : '#188038';
    $('rt-sub').textContent = selIdx === 0 ? (heavy ? 'Best route, despite heavier traffic than usual' : 'Best route') : Math.max(1, Math.round((r.duration - best.duration) / 60)) + ' min slower';
    const eg = eco(); $('rt-gas').hidden = !(eg && eg.i === selIdx); if (eg) $('rt-gas').querySelector('em').textContent = 'Saves ' + eg.pct + '% gas';
    const on = !!(to && to.lat != null && savedPlaces.some((p) => p.lat === to.lat && p.lng === to.lng));
    $('rt-save').querySelector('span').innerHTML = svg(on ? 'bookmarkOn' : 'bookmark', 22);
    $('rt-save').querySelector('em').textContent = on ? 'Saved' : 'Save';
  }
  function select(i) {
    selIdx = i; if (map.getSource('route')) { map.getSource('route').setData(routeFC()); applyGradient(); } renderLabels(); renderSheet();
  }
  function enterRouteView() {
    routeActive = true; document.body.classList.add('routing');
    panel.hidden = true; tellParent(true); document.activeElement && document.activeElement.blur();
    // body.routing now owns hiding the zoom buttons, so drop the Directions
    // flag — otherwise it would linger and keep them hidden after clearRoute.
    document.body.classList.remove('directions-open');
    placeMarkers(); ensureLayers(); renderLabels(); renderTop(); renderSheet();
    requestAnimationFrame(fitRoute);
  }
  function clearRoute() {
    routeActive = false; document.body.classList.remove('routing');
    ['route-line', 'route-casing', 'alt-hit', 'alt-line', 'alt-casing'].forEach((id) => map.getLayer(id) && map.removeLayer(id));
    if (map.getSource('route')) map.removeSource('route');
    [destMarker, originMarker].concat(stopMarkers, labelMarkers).forEach((m) => m && m.remove());
    destMarker = originMarker = null; stopMarkers = []; labelMarkers = []; stops = []; routes = {};
    to = null; toIn.value = ''; $('rt-menu').hidden = true; $('rt-opts').hidden = true; tellParent(false);
  }

  // ----- Route view controls -----
  document.querySelectorAll('.rt-tab').forEach((t) => t.addEventListener('click', () => {
    const m = t.dataset.m;
    if (m === 'transit') { window.open(gmapsUrl('transit'), '_blank', 'noopener'); return; }
    if (!routes[m]) { flash('Walang ruta para sa mode na ito.'); return; }
    curMode = mode = m; selIdx = 0;
    panel.querySelectorAll('.dir-modes button').forEach((x) => x.classList.toggle('on', x.dataset.mode === m));
    if (map.getSource('route')) { map.getSource('route').setData(routeFC()); applyGradient(); }
    renderLabels(); renderSheet(); fitRoute();
  }));
  $('rt-close').addEventListener('click', clearRoute);
  $('rt-edit').addEventListener('click', openPanel);
  $('rt-swap').addEventListener('click', () => $('dir-swap').click());
  $('rt-layers').addEventListener('click', () => { const b = document.querySelector('#base-switch button:not(.active)'); if (b) b.click(); });
  $('rt-locate').addEventListener('click', () => {
    getUserLoc().then((l) => map.flyTo({ center: [l.lng, l.lat], zoom: 15, duration: 1200 })).catch(() => flash('Hindi makuha ang location mo.'));
  });
  $('rt-start').addEventListener('click', () => window.open(gmapsUrl(TRAVEL[curMode], true), '_blank', 'noopener'));
  $('rt-stop').addEventListener('click', () => { addingStop = true; openPanel(); });
  async function shareRoute() {
    const url = gmapsUrl(TRAVEL[curMode]);
    try { if (navigator.share) { await navigator.share({ title: 'Directions to ' + (to.label || 'destination'), url }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); flash('Nakopya na ang link ng directions.'); } catch (e) { flash(url, 6000); }
  }
  $('rt-share').addEventListener('click', shareRoute);
  $('rt-share2').addEventListener('click', shareRoute);
  $('rt-save').addEventListener('click', () => {
    if (!to || to.lat == null) return;
    const i = savedPlaces.findIndex((p) => p.lat === to.lat && p.lng === to.lng);
    if (i >= 0) savedPlaces.splice(i, 1); else savedPlaces.unshift(to);
    store.set('traffic_saved', savedPlaces); renderSheet();
  });
  const showOpts = () => { $('o-toll').checked = opts.toll; $('o-hwy').checked = opts.hwy; $('o-ferry').checked = opts.ferry; $('rt-opts').hidden = false; };
  $('rt-tune').addEventListener('click', showOpts);
  $('o-done').addEventListener('click', () => {
    opts.toll = $('o-toll').checked; opts.hwy = $('o-hwy').checked; opts.ferry = $('o-ferry').checked;
    $('rt-opts').hidden = true; go();
  });
  $('rt-dots').addEventListener('click', (e) => {
    e.stopPropagation(); const m = $('rt-menu');
    if (!m.hidden) { m.hidden = true; return; }
    m.textContent = '';
    const add = (t, fn) => { const b = h('button', '', t); b.type = 'button'; b.addEventListener('click', () => { m.hidden = true; fn(); }); m.appendChild(b); };
    add('Route options', showOpts); add('Share directions', shareRoute);
    if (stops.length) add('Remove stops', () => { stops = []; go(); });
    m.hidden = false;
  });
  document.addEventListener('click', (e) => { if (!e.target.closest('#rt-menu')) $('rt-menu').hidden = true; });

  // Live traffic overlay for the satellite base: color roads by congestion.
  function addTrafficOverlay() {
    if (map.getSource('traffic')) return;
    map.addSource('traffic', { type: 'vector', url: 'mapbox://mapbox.mapbox-traffic-v1' });
    map.addLayer({
      id: 'traffic-flow',
      type: 'line',
      source: 'traffic',
      'source-layer': 'traffic',
      paint: {
        'line-width': 2.5,
        'line-opacity': 0.9,
        'line-color': [
          'match', ['get', 'congestion'],
          'low', '#2BC82B',
          'moderate', '#F1BF40',
          'heavy', '#CC0704',
          'severe', '#7A1F1B',
          '#888888'
        ]
      }
    });
  }

  map.on('style.load', () => {
    if (currentBase === 'satellite') addTrafficOverlay();
  });

  // Street / Satellite switcher (same idea as the Flood Prone layers control).
  const switchBox = document.getElementById('base-switch');
  switchBox.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-base]');
    if (!btn) return;
    const base = btn.dataset.base;
    if (base === currentBase) return;
    switchBox.querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
    currentBase = base;
    map.setStyle(base === 'satellite' ? STYLE_SATELLITE : STYLE_TRAFFIC);
  });

  map.on('error', (e) => {
    const status = e && e.error && e.error.status;
    if (status === 401) {
      showNotice('Hindi valid ang Mapbox token — i-check ang VITE_MAPBOX_TRAFFIC_TOKEN.');
    } else if (status === 429) {
      showNotice('Naubos na ang Mapbox quota ngayong buwan. Subukan ulit sa susunod.');
    }
  });

  // The traffic-day-v2 style renders LIVE congestion by itself — no polling
  // needed. The Recenter button from the parent app returns to the overview.
  window.trafficRecenter = function () {
    map.fitBounds(RIZAL_BOUNDS, { padding: 20, duration: 1200 });
  };

  let trafficUserMarker = null;
  function showTrafficUserLocation(lat, lng) {
    if (typeof lat !== 'number' || typeof lng !== 'number' || isNaN(lat) || isNaN(lng)) return;
    userLoc = { lat: lat, lng: lng };
    if (!trafficUserMarker) {
      const el = document.createElement('div');
      el.className = 'traffic-user-marker';
      el.innerHTML = '<span class="traffic-user-dot"></span>';
      trafficUserMarker = new mapboxgl.Marker({ element: el })
        .setLngLat([lng, lat])
        .addTo(map);
    } else {
      trafficUserMarker.setLngLat([lng, lat]);
    }
    map.flyTo({ center: [lng, lat], zoom: 16, duration: 1600 });
  }

  // Messages from the parent app: recenter, and "Show your location" which
  // drops a pulsing blue dot on this map and flies to it.
  window.addEventListener('message', (event) => {
    if (!event.data) return;
    if (event.data.type === 'traffic-recenter') window.trafficRecenter();
    if (event.data.type === 'traffic-user-location') showTrafficUserLocation(event.data.lat, event.data.lng);
  });
</script>
</body>
</html>

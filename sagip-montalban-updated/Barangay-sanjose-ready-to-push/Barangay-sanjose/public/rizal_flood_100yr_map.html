<style>

  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;}

  #legend{

  }

  #legend .sw{width:13px;height:13px;border-radius:2px;display:inline-block;}
</style>
</head>
<body>
<div id="map"></div>

    e.tile.dataset.retryStep = '2';

    e.tile.dataset.retryStep = '3';

      color: HAZARD_COLORS[val] || "#999",
      weight: 0.5,
      fillColor: HAZARD_COLORS[val] || "transparent",
      fillOpacity: 0.55
    };
  }
}).addTo(map);

// Start zoomed out enough to show the complete flood-prone dataset.
// The map remains bounded to the flood layer while users can zoom freely.
const floodBounds = floodLayer.getBounds();
map.fitBounds(floodBounds, { padding: [40, 40], maxZoom: 11 });
map.setMaxBounds(floodBounds.pad(0.05));
map.options.maxBoundsViscosity = 1.0;
map.setMinZoom(9);

// Recenter button from the parent app returns to the fixed overview.
function recenterFloodMap() {
  map.flyToBounds(floodBounds, { padding: [40, 40], maxZoom: 11, duration: 1.25, easeLinearity: 0.15 });
}
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'flood-recenter') recenterFloodMap();
});
</script>
</body>
</html>

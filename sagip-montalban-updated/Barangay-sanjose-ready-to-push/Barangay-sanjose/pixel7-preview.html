<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel 7 Preview - Barangay San Jose</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0f172a; font-family:system-ui; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:24px; color:white; }
    h1 { margin:12px 0 6px; font-size:18px; }
    p { opacity:0.7; font-size:13px; margin-bottom:18px; text-align:center; max-width:420px; }
    .phone { background:#000; border-radius:34px; padding:14px; box-shadow:0 24px 64px rgba(0,0,0,0.6), inset 0 0 0 2px #333; position:relative; }
    .phone::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:110px; height:26px; background:#000; border-radius:0 0 18px 18px; z-index:40; }
    .screen { background:white; border-radius:28px; overflow:hidden; position:relative; }
    .screen iframe { border:0; display:block; background:white; }
    .label { text-align:center; margin-top:12px; font-size:12px; font-weight:600; letter-spacing:0.5px; opacity:0.8; }
    .controls { margin-top:30px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    .controls a, .controls button { background:#10b981; color:white; padding:10px 18px; border-radius:10px; text-decoration:none; font-size:13px; font-weight:600; border:0; cursor:pointer; }
    .controls a.secondary { background:#334155; }
  </style>
</head>
<body>
  <h1>📱 Barangay San Jose - Pixel 7 Preview</h1>
  <p>Pixel 7 na view (412 × 926 CSS px). Yung default preview ngayon ay ang Pixel 7 na view; desktop app sa /?full=1.</p>

  <div class="phone">
    <div class="screen">
      <iframe id="pixel7" src="/index.html" width="412" height="926" title="Pixel 7 Preview"></iframe>
    </div>
  </div>
  <div class="label">Pixel 7 — 412 x 926</div>

  <div class="controls">
    <a href="/index.html?full=1" target="_blank">Open Desktop App</a>
    <a href="/index.html" target="_blank">Open in New Tab</a>
  </div>
</body>
</html>

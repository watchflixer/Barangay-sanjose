name: Keep Flood Server Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          if [ -z "${{ vars.FLOOD_LIVE_URL }}" ]; then
            echo "FLOOD_LIVE_URL repo variable is not set yet — skipping ping."
            exit 0
          fi
          HEALTH_URL=$(echo "${{ vars.FLOOD_LIVE_URL }}" | sed 's#/api/flood-status#/health#')
          echo "Pinging $HEALTH_URL"
          curl -sS --max-time 20 "$HEALTH_URL" || echo "Ping failed (server may be waking up) — not treated as a failure."

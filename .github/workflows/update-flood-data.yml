name: Update Flood Data (PAGASA Rodriguez Station)

on:
  schedule:
        - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Fetch PAGASA flood data
        run: node scripts/fetch-flood-data.mjs

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/data/flood-status.json; then
            git add public/data/flood-status.json
            git commit -m "Auto-update flood data (Rodriguez station)"
            git push
          else
            echo "No changes in flood data."
          fi

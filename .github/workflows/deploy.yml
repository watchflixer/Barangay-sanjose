name: Verify Cloudflare Pages build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sagip-montalban-updated/Barangay-sanjose-ready-to-push/Barangay-sanjose
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sagip-montalban-updated/Barangay-sanjose-ready-to-push/Barangay-sanjose/package-lock.json
      - run: npm ci
      - run: npm run build
